<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - System Control</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Custom loader */
    .loader {
      border-top-color: #3b82f6;
      animation: spinner 1s linear infinite;
    }
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Clean up native color picker */
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 0.25rem; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <div id="auth-overlay" class="fixed inset-0 bg-white/90 z-50 flex flex-col items-center justify-center">
    <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-10 w-10 mb-4"></div>
    <h2 id="auth-message" class="text-lg font-semibold text-slate-800">Verifying Access...</h2>
  </div>

  <div id="save-overlay" class="fixed inset-0 bg-slate-900/20 z-40 hidden flex-col items-center justify-center">
    <div class="bg-white p-4 rounded-md shadow-lg flex items-center gap-3">
      <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-5 w-5"></div>
      <p class="font-medium text-slate-700 text-sm">Publishing...</p>
    </div>
  </div>

  <header class="bg-white border-b border-slate-300 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 h-14 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="text-slate-500 hover:text-blue-600 transition-colors" title="Back to App">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        <div class="h-5 w-px bg-slate-300"></div>
        <span class="font-semibold text-slate-800">System Control</span>
      </div>
      <button id="logout-btn" class="text-sm px-3 py-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded transition-colors">
        Sign Out
      </button>
    </div>
  </header>

  <main id="admin-content" class="max-w-5xl mx-auto px-4 py-6 hidden">
    
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-xl font-bold text-slate-900">Global Settings</h1>
      <button id="save-config-btn" class="bg-blue-600 text-white text-sm font-medium px-4 py-2 rounded hover:bg-blue-700 transition-colors shadow-sm">
        Save Changes
      </button>
    </div>

    <div class="bg-white border border-slate-300 rounded shadow-sm">
      
      <div class="flex flex-col sm:flex-row border-b border-slate-200 p-4 hover:bg-slate-50 transition-colors">
        <div class="sm:w-1/3 mb-2 sm:mb-0">
          <label for="app-name-input" class="text-sm font-semibold text-slate-800 block">Application Name</label>
          <span class="text-xs text-slate-500">Appears in browser tab and navigation.</span>
        </div>
        <div class="sm:w-2/3">
          <input type="text" id="app-name-input" placeholder="e.g., FinTrack" class="w-full sm:max-w-md bg-white border border-slate-300 text-sm rounded px-3 py-2 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none">
        </div>
      </div>

      <div class="flex flex-col sm:flex-row border-b border-slate-200 p-4 hover:bg-slate-50 transition-colors">
        <div class="sm:w-1/3 mb-2 sm:mb-0">
          <label for="notification-input" class="text-sm font-semibold text-slate-800 block">Global Banner</label>
          <span class="text-xs text-slate-500">Visible to all users. Leave blank to disable.</span>
        </div>
        <div class="sm:w-2/3">
          <textarea id="notification-input" rows="2" placeholder="Enter announcement text..." class="w-full sm:max-w-md bg-white border border-slate-300 text-sm rounded px-3 py-2 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none resize-y"></textarea>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row border-b border-slate-200 p-4 hover:bg-slate-50 transition-colors">
        <div class="sm:w-1/3 mb-2 sm:mb-0">
          <label class="text-sm font-semibold text-slate-800 block">Primary Brand Color</label>
          <span class="text-xs text-slate-500">Main accent color across the app.</span>
        </div>
        <div class="sm:w-2/3 flex items-center gap-3">
          <input type="color" id="color-picker" class="h-9 w-12 cursor-pointer bg-transparent">
          <input type="text" id="color-hex-input" placeholder="#3b82f6" class="w-28 uppercase font-mono bg-white border border-slate-300 text-sm rounded px-3 py-2 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none">
        </div>
      </div>

      <div class="flex flex-col sm:flex-row p-4 bg-red-50/30 hover:bg-red-50/60 transition-colors rounded-b">
        <div class="sm:w-1/3 mb-2 sm:mb-0">
          <label class="text-sm font-semibold text-red-700 block">Maintenance Mode</label>
          <span class="text-xs text-red-500">Lock out all non-admin users.</span>
        </div>
        <div class="sm:w-2/3 flex items-center">
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="maintenance-toggle" class="sr-only peer">
            <div class="w-10 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-red-600"></div>
          </label>
        </div>
      </div>

    </div>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
