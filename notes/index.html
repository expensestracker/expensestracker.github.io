<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1F21" media="(prefers-color-scheme: dark)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Activity Log</title>
  <meta name="description" content="Log and track your daily activities with a real-time timeline.">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Hide scrollbar for clean app-like UI */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Chrome scroll overflow & viewport fix */
    html {
      height: 100%;
      height: -webkit-fill-available;
    }
    
    body {
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      overscroll-behavior: none;
      width: 100%;
      margin: 0;
      padding: 0;
      touch-action: pan-x pan-y;
    }

    /* Safe area padding utilities */
    .pt-safe { padding-top: max(1rem, env(safe-area-inset-top, 0px)); }
    .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom, 0px)); }
    
    /* Animations */
    @keyframes slideUp { 0% { transform: translateY(100%); } 100% { transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.3s ease forwards; }

    @keyframes smoothGrow {
      0%   { opacity: 0; transform: translateY(12px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-grow { opacity: 0; animation: smoothGrow 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

    @keyframes barRun {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(220%); }
    }
    .status-bar-line { transition: background 0.3s ease, opacity 0.4s ease; }
    .offline-bar { background: linear-gradient(90deg, transparent, #e11d48, transparent); width: 100%; opacity: 1; }
    .connecting-bar { background: linear-gradient(90deg, transparent, #f59e0b, transparent); animation: barRun 1.4s infinite ease-in-out; opacity: 1; }
    .syncing-bar { background: linear-gradient(90deg, transparent, #4f46e5, transparent); animation: barRun 1s infinite ease-in-out; opacity: 1; }
    .online-bar { opacity: 0; animation: none; }
  </style>
</head>
<body class="bg-slate-200/50 flex items-center justify-center h-full text-slate-800 font-sans overflow-hidden overscroll-none w-full">

  <div class="w-full max-w-md h-full sm:h-[850px] bg-slate-50 sm:rounded-3xl sm:shadow-2xl relative overflow-clip flex flex-col overscroll-none">

    <header class="px-6 py-4 flex justify-between items-center bg-white/95 backdrop-blur-md z-40 sticky top-0 pt-safe border-b border-slate-100 shrink-0">
        <h1 class="text-lg font-bold text-slate-900 leading-tight">Activity Log</h1>
        
        <div class="flex items-center gap-1.5 bg-slate-50 px-2.5 py-1 rounded-full border border-slate-100">
          <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
          <span id="status-text" class="text-[10px] font-bold text-slate-500 tracking-wider uppercase mt-[1px]">Connecting</span>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto no-scrollbar relative scroll-smooth overscroll-contain bg-slate-50" id="scroll-container">
      
      <div id="loading-state" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-50 z-30 transition-opacity duration-300">
        <div class="w-8 h-8 border-4 border-slate-200 border-t-indigo-600 rounded-full animate-spin"></div>
        <p class="mt-4 text-sm font-semibold text-slate-400">Loading activities...</p>
      </div>

      <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-50 z-20 transition-opacity duration-300 opacity-0 pointer-events-none text-center px-8">
        <div class="w-16 h-16 bg-white rounded-3xl border border-slate-100 shadow-sm flex items-center justify-center mb-3 text-slate-300">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
        </div>
        <h3 class="text-lg font-bold text-slate-800">No entries yet</h3>
        <p class="text-md text-slate-500 mt-1">Log your first activity below<br>and it'll appear here.</p>
      </div>

      <div class="py-7 flex flex-col relative z-10 min-h-full" id="notes-container">
        <div id="timeline-line" class="hidden absolute left-[81px] w-[2px] bg-gradient-to-b from-transparent via-indigo-200 to-transparent top-7 bottom-0 z-0"></div>
      </div>
    </main>

    <footer id="bottom-bar" class="relative bg-white/95 backdrop-blur-md shrink-0 z-40 px-3 py-3 pb-safe border-t border-slate-200 transition-colors">
      
      <div class="absolute -top-[1px] left-0 right-0 h-[2px] bg-transparent overflow-hidden">
        <div id="status-line" class="status-bar-line h-full w-[60%] rounded-md connecting-bar"></div>
      </div>

      <form id="add-form" class="flex items-end gap-2.5">
        <div class="flex-1 flex items-center bg-slate-50 border-2 border-slate-200 rounded-3xl focus-within:border-indigo-500 focus-within:ring-4 focus-within:ring-indigo-500/10 focus-within:bg-white transition-all">
          <textarea id="add-content" required rows="1" class="block w-full bg-transparent px-4 py-2.5 text-[15px] text-slate-900 font-semibold placeholder:text-slate-400 placeholder:font-medium resize-none max-h-[140px] focus:outline-none no-scrollbar leading-relaxed" placeholder="Log activity..." autocomplete="off"></textarea>
        </div>
        <button type="submit" id="submit-btn" disabled class="mb-0.5 w-[46px] h-[46px] shrink-0 bg-indigo-600 text-white rounded-full flex items-center justify-center transition-all shadow-lg shadow-indigo-200 hover:bg-indigo-700 active:scale-95 disabled:opacity-50 disabled:active:scale-100 disabled:shadow-none disabled:cursor-not-allowed">
          <svg class="w-5 h-5 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
        </button>
      </form>
    </footer>

    <div id="edit-modal" class="absolute inset-0 bg-slate-1000/100 backdrop-blur-sm z-[100] hidden flex-col justify-end animate-fade-in opacity-0">
      <div class="border-t border-slate-400 bg-white w-full p-6 rounded-t-3xl shadow-2xl transform transition-transform animate-slide-up pb-safe">
        
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
            <span class="w-2 h-6 bg-indigo-500 rounded-full"></span>Edit Entry
          </h2>
          <button type="button" class="close-modal-btn p-2 bg-slate-100 rounded-full text-slate-500 hover:text-slate-800 hover:bg-slate-200 transition-colors focus:outline-none">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>

        <form id="edit-form" class="space-y-4 text-left">
          <input type="hidden" id="edit-id">
          
          <div class="relative w-full">
            <textarea id="edit-content" required rows="4" class="block w-full px-4 py-3 text-md text-slate-900 font-bold bg-slate-50 rounded-2xl border-2 border-slate-200 focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all resize-none no-scrollbar leading-relaxed"></textarea>
          </div>
          
          <div class="flex gap-3 pt-2">
            <button type="button" id="delete-btn" class="w-[52px] h-[52px] shrink-0 flex items-center justify-center bg-rose-50 text-rose-600 font-bold rounded-2xl border-2 border-rose-100 hover:bg-rose-100 transition-all active:scale-95" aria-label="Delete entry">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
            <button type="submit" class="flex-1 py-3.5 bg-indigo-600 text-white font-bold rounded-2xl hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all active:scale-95 text-[15px]">
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/notes/service-worker.js', { scope: '/notes/' })
          .catch(e => console.warn('SW registration failed:', e));
      });
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import {
      getDatabase, ref, onValue, push, set, update, remove,
      serverTimestamp, onChildAdded, onChildChanged, onChildRemoved,
      query, orderByChild
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBmXewXcQQt97EJzbKceLbCoTTG_9aJlJI",
      authDomain: "bhaskarjyoticlub.firebaseapp.com",
      databaseURL: "https://bhaskarjyoticlub-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "bhaskarjyoticlub",
      storageBucket: "bhaskarjyoticlub.firebasestorage.app",
      messagingSenderId: "730168687443",
      appId: "1:730168687443:web:479bedc258bd9dd06fffa6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const notesRef = ref(db, 'notes');

    /* --- Network & Status State --- */
    const statusLine = document.getElementById('status-line');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    let connectionState = 'connecting';
    let activityState = 'idle';
    let activeUploads = 0;

    function updateStatusUI() {
      // Bottom line updates
      statusLine.className = 'status-bar-line h-full w-[60%] rounded-md'; 
      
      // Header pills updates
      statusDot.className = 'w-2 h-2 rounded-full';

      if (connectionState === 'offline') {
        statusLine.classList.add('offline-bar');
        statusDot.classList.add('bg-rose-500');
        statusText.textContent = 'Offline';
      } else if (connectionState === 'connecting') {
        statusLine.classList.add('connecting-bar');
        statusDot.classList.add('bg-amber-400', 'animate-pulse');
        statusText.textContent = 'Connecting';
      } else {
        if (activeUploads > 0 || activityState === 'syncing') {
            statusLine.classList.add('syncing-bar');
            statusDot.classList.add('bg-indigo-500', 'animate-pulse');
            statusText.textContent = 'Syncing';
        } else {
            statusLine.classList.add('online-bar');
            statusDot.classList.add('bg-emerald-500');
            statusText.textContent = 'Online';
        }
      }
    }

    onValue(ref(db, '.info/connected'), (snap) => {
      connectionState = snap.val() ? 'online' : 'connecting';
      updateStatusUI();
    });

    window.addEventListener('online',  () => { connectionState = 'connecting'; updateStatusUI(); });
    window.addEventListener('offline', () => { connectionState = 'offline';    updateStatusUI(); });

    function runSyncTask(promise) {
      activeUploads++;
      updateStatusUI();
      return promise.finally(() => {
        activeUploads--;
        updateStatusUI();
      });
    }

    let delayResetTimer;
    let delayIndex = 0;

    function triggerDownloadUI() {
      if (activeUploads > 0) return;
      activityState = 'syncing';
      updateStatusUI();
      clearTimeout(delayResetTimer);
      delayResetTimer = setTimeout(() => {
        delayIndex = 0;
        if (activeUploads === 0) {
          activityState = 'idle';
          updateStatusUI();
        }
      }, 500);
    }

    /* --- Input Setup --- */
    const textarea = document.getElementById('add-content');
    const submitBtn = document.getElementById('submit-btn');
    const bottomBar = document.getElementById('bottom-bar');

    textarea.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
      submitBtn.disabled = !this.value.trim();
    });

    textarea.addEventListener('focus', () => {
      setTimeout(() => {
        bottomBar.scrollIntoView({ behavior: 'smooth', block: 'end' });
      }, 300);
    });
    
    // Note: The previous enter-to-submit logic was completely removed.
    // Textarea natively handles multi-line support on 'Enter' now.

    /* --- Forms --- */
    document.getElementById('add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!textarea.value.trim()) return;
      runSyncTask(set(push(notesRef), {
        content: textarea.value.trim(),
        timestamp: serverTimestamp()
      }));
      textarea.value = '';
      textarea.style.height = 'auto';
      submitBtn.disabled = true;
      textarea.focus(); // Keeps keyboard open after sending
    });

    document.getElementById('edit-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const content = document.getElementById('edit-content').value.trim();
      if (!content) return;
      runSyncTask(update(ref(db, `notes/${document.getElementById('edit-id').value}`), { content }));
      closeModals();
    });

    document.getElementById('delete-btn').addEventListener('click', () => {
      if (confirm('Permanently delete this entry?')) {
        runSyncTask(remove(ref(db, `notes/${document.getElementById('edit-id').value}`)));
        closeModals();
      }
    });

    /* --- Modals --- */
    const openModal  = (id) => {
        const m = document.getElementById(id);
        m.classList.remove('hidden');
        m.classList.add('flex');
    };
    const closeModals = () => {
        document.querySelectorAll('.modal-backdrop, #edit-modal').forEach(m => {
            m.classList.remove('flex');
            m.classList.add('hidden');
        });
    };

    document.querySelectorAll('.close-modal-btn').forEach(btn => btn.addEventListener('click', closeModals));

    document.querySelectorAll('#edit-modal').forEach(backdrop => {
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) closeModals();
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModals();
    });

    const openEdit = (id, content) => {
      document.getElementById('edit-id').value = id;
      document.getElementById('edit-content').value = content;
      openModal('edit-modal');
    };

    /* --- UI State Management (Loading & Empty States) --- */
    const emptyState = document.getElementById('empty-state');
    const loadingState = document.getElementById('loading-state');
    const container = document.getElementById('notes-container');
    const scrollContainer = document.getElementById('scroll-container');
    
    let isInitialDataLoaded = false;
    let lastDateStr = null;
    let scrollTimeout;

    // Detect when the initial batch of data has finished loading from Firebase
    onValue(notesRef, (snap) => {
        if (!isInitialDataLoaded) {
            isInitialDataLoaded = true;
            
            // Fade out loading screen
            loadingState.classList.add('opacity-0');
            setTimeout(() => {
                loadingState.remove(); // Safely remove from DOM after transition
                updateEmptyState();
            }, 300);
        }
    }, { onlyOnce: true });

    function updateEmptyState() {
      if (!isInitialDataLoaded) return; // Prevent flashing empty state during load

      const hasItems = container.querySelectorAll('.timeline-item').length > 0;
      if (hasItems) {
          emptyState.classList.remove('opacity-100', 'pointer-events-auto');
          emptyState.classList.add('opacity-0', 'pointer-events-none');
      } else {
          emptyState.classList.remove('opacity-0', 'pointer-events-none');
          emptyState.classList.add('opacity-100', 'pointer-events-auto');
      }
    }

    const scrollToBottom = () => {
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        scrollContainer.scrollTo({ top: scrollContainer.scrollHeight, behavior: 'smooth' });
      }, 100);
    };

    const appContainer = document.querySelector('.max-w-md');
    if (window.visualViewport) {
      const adjustHeight = () => {
        appContainer.style.height = `${window.visualViewport.height}px`;
        scrollToBottom(); 
      };
      window.visualViewport.addEventListener('resize', adjustHeight);
      adjustHeight();
    }

    /* --- Firebase Listeners --- */
    onChildAdded(query(notesRef, orderByChild('timestamp')), (data) => {
      triggerDownloadUI();

      const tLine = document.getElementById('timeline-line');
      if (tLine) tLine.classList.remove('hidden');

      const note = { id: data.key, ...data.val() };
      const dateObj = note.timestamp ? new Date(note.timestamp) : new Date();
      const dateStr = dateObj.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const timeStr = dateObj.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase();

      const currentDelay = delayIndex * 0.07;
      delayIndex++;

      const oldActive = document.querySelector('.dot-active-container');
      if (oldActive) {
          oldActive.outerHTML = `<div class="w-1.5 h-1.5 bg-slate-300 rounded-full shadow-[0_0_0_4px_#f8fafc]"></div>`;
      }

      if (dateStr !== lastDateStr) {
        lastDateStr = dateStr;
        const headerDiv = document.createElement('div');
        headerDiv.className = 'w-full flex justify-center py-3 pb-6 relative z-10 animate-grow';
        headerDiv.style.animationDelay = `${currentDelay}s`;
        headerDiv.innerHTML = `<span class="bg-white px-3 py-1 text-[11px] font-bold text-slate-500 rounded-full tracking-wider border border-slate-100 shadow-sm">${dateStr}</span>`;
        container.appendChild(headerDiv);
      }

      const itemDiv = document.createElement('div');
      itemDiv.className = 'timeline-item flex items-start w-full relative z-10 animate-grow';
      itemDiv.style.animationDelay = `${currentDelay}s`;
      itemDiv.id = `note-${note.id}`;
      
      itemDiv.innerHTML = `
        <div class="w-[72px] shrink-0 text-right pr-4 pt-1">
            <span class="text-[11px] text-slate-500 font-bold">${timeStr}</span>
        </div>
        <div class="w-5 shrink-0 flex justify-center pt-1.5 relative">
          <div class="relative w-2.5 h-2.5 flex items-center justify-center dot-active-container">
            <span class="absolute w-5 h-5 rounded-full bg-indigo-500 opacity-30 animate-[ping_2s_cubic-bezier(0,0,0.2,1)_infinite]"></span>
            <span class="relative w-2 h-2 rounded-full bg-indigo-500 shadow-[0_0_0_4px_#f8fafc]"></span>
          </div>
        </div>
        <div class="flex-1 pl-3 pb-7 relative text-left">
          <p id="text-${note.id}" class="text-[15.5px] text-slate-800 font-medium leading-relaxed whitespace-pre-wrap break-words pr-4 cursor-pointer active:opacity-50 active:scale-95 transition-all select-none content-text"></p>
        </div>`;

      const pTag = itemDiv.querySelector('.content-text');
      pTag.textContent = note.content;
      pTag.addEventListener('click', () => openEdit(note.id, note.content));

      container.appendChild(itemDiv);
      updateEmptyState();
      scrollToBottom();
    });

    onChildChanged(notesRef, (data) => {
      triggerDownloadUI();
      const pTag = document.getElementById(`text-${data.key}`);
      if (pTag) {
        const newContent = data.val().content;
        pTag.textContent = newContent;
        const clone = pTag.cloneNode(true);
        clone.addEventListener('click', () => openEdit(data.key, newContent));
        pTag.replaceWith(clone);
      }
    });

    onChildRemoved(notesRef, (data) => {
      triggerDownloadUI();
      const itemDiv = document.getElementById(`note-${data.key}`);
      if (itemDiv) itemDiv.remove();

      if (container.querySelectorAll('.timeline-item').length === 0) {
        const tLine = document.getElementById('timeline-line');
        if (tLine) tLine.classList.add('hidden');
        lastDateStr = null;
      }
      updateEmptyState();
    });
  </script>
</body>
</html>
