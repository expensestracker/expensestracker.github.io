<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1F21" media="(prefers-color-scheme: dark)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Timelines</title>
  <meta name="description" content="Log and track your daily Timeline in real-time.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192x192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Hide scrollbar for clean app-like UI */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    :root { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; }
    body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; }

    /* Chrome scroll overflow & viewport fix */
    html, body {
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
      overscroll-behavior: none;
      width: 100%;
      margin: 0;
      padding: 0;
      touch-action: pan-x pan-y;
    }

    /* Safe area padding utilities */
    .pt-safe { padding-top: max(0.6rem, env(safe-area-inset-top, 0px)); }
    .pb-safe { padding-bottom: max(0.6rem, env(safe-area-inset-bottom, 0px)); }

    /* Animations */
    @keyframes smoothGrow {
      0%   { opacity: 0; transform: translateY(12px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-grow { opacity: 0; animation: smoothGrow 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

    @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    .shimmer {
      background: linear-gradient(90deg, #eef1f6 25%, #e4e9f1 37%, #eef1f6 63%);
      background-size: 800px 100%;
      animation: shimmer 1.6s linear infinite;
    }

    /* Bottom Toast Notifications */
    @keyframes toastBottomIn { 0% { opacity: 0; transform: translateY(20px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toastBottomOut { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(20px) scale(0.96); } }
    .toast-in { animation: toastBottomIn 0.3s cubic-bezier(0.16,1,0.3,1) forwards; }
    .toast-out { animation: toastBottomOut 0.25s ease forwards; }

    /* Menu dropdown */
    @keyframes popoverIn { 0% { opacity: 0; transform: translateY(-6px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    .menu-in { transform-origin: top right; animation: popoverIn 0.18s cubic-bezier(0.16,1,0.3,1) forwards; }

    /* FAB */
    @keyframes popIn { 0% { opacity: 0; transform: translateY(6px) scale(0.8); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    .fab-pop { animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1) forwards; }

    /* Better focus rings */
    textarea:focus, input:focus, button:focus-visible { outline: none; }
    ::selection { background: #c7d2fe; }

    /* Swipe Logic Fixes */
    .swipe-container { touch-action: pan-y; }

    /* Smooth transition for backdrop blur */
    .blur-backdrop {
      filter: blur(4px);
      opacity: 0.6;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .blur-transition {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-slate-200/50 flex items-center justify-center h-full text-slate-800 font-sans overflow-hidden overscroll-none w-full">

  <div class="w-full max-w-md h-full sm:h-[850px] bg-slate-50 sm:rounded-3xl sm: relative overflow-clip flex flex-col overscroll-none">

    <!-- Bottom Toast Container -->
    <div id="toast-container" class="absolute left-0 right-0 bottom-[100px] z-[100] flex flex-col-reverse items-center gap-2 px-5 pointer-events-none"></div>

    <!-- Header -->
    <header id="app-header" class="bg-slate-50/90 backdrop-blur-xl backdrop-saturate-150 z-40 sticky top-0 pt-safe border-b border-slate-200/80 shrink-0 blur-transition">
      <div class="px-5 py-3.5 flex justify-between items-center">
        <div class="min-w-0">
          <h1 class="text-xl font-extrabold text-slate-900 leading-tight tracking-tight">Timelines</h1>
          <div class="flex items-center gap-1.5 mt-1">
            <span id="main-status-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
            <span id="main-status-text" class="text-[11px] font-bold text-slate-500 uppercase tracking-wide">Connecting...</span>
          </div>
        </div>
        
        <div class="flex items-center relative">
          <!-- Menu Button -->
          <button id="menu-btn" type="button" aria-label="Menu" class="w-10 h-10 flex items-center justify-center rounded-full bg-white border border-slate-200 text-slate-600 hover:text-indigo-600 hover:border-indigo-200 active:scale-90 transition-all shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
          </button>

          <!-- Dropdown Menu -->
          <div id="dropdown-menu" class="hidden absolute right-0 top-12 w-52 bg-white rounded-2xl border border-slate-200 shadow-xl z-50 py-1.5 menu-in">
            <button id="menu-delete-all-btn" class="w-full flex items-center gap-2.5 px-4 py-2.5 text-left text-[14px] font-semibold text-rose-600 hover:bg-rose-50 transition-colors">
              <svg class="w-4 h-4 shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              Delete All Entries
            </button>
          </div>
        </div>
      </div>

      <!-- Always-on Search Row -->
      <div id="search-row" class="px-5 pb-4">
        <div class="relative">
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z"/></svg>
          <input id="search-input" type="text" placeholder="Search Timeline…" class="w-full pl-10 pr-10 py-2.5 text-[14px] font-medium bg-white border border-slate-200 rounded-2xl focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all placeholder:text-slate-400 shadow-sm">
          <button id="search-clear-btn" type="button" class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-slate-100 text-slate-500 items-center justify-center hover:bg-slate-200 active:scale-90 transition-all">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto no-scrollbar relative scroll-smooth overscroll-contain bg-slate-50/50 blur-transition" id="scroll-container">

      <!-- Loading State -->
      <div id="loading-state" class="absolute inset-0 px-5 pt-7 z-30 transition-opacity duration-300 pointer-events-none">
        <div class="flex flex-col gap-5">
          <div class="flex justify-center"><div class="w-24 h-5 rounded-full shimmer"></div></div>
          <div class="w-full h-32 rounded-2xl shimmer"></div>
          <div class="w-full h-24 rounded-2xl shimmer"></div>
        </div>
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center z-20 transition-opacity duration-300 opacity-0 pointer-events-none text-center px-8">
        <div class="w-16 h-16 bg-white rounded-3xl border border-slate-100 shadow-sm flex items-center justify-center mb-3 text-indigo-300">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
        </div>
        <h3 class="text-lg font-bold text-slate-800">No entries yet</h3>
        <p class="text-md text-slate-500 mt-1">Log your first Timeline entry below.</p>
      </div>

      <!-- No Results State -->
      <div id="no-results-state" class="absolute inset-0 flex flex-col items-center justify-center z-20 transition-opacity duration-300 opacity-0 pointer-events-none text-center px-8">
        <div class="w-16 h-16 bg-white rounded-3xl border border-slate-100 shadow-sm flex items-center justify-center mb-3 text-slate-300">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z"/></svg>
        </div>
        <h3 class="text-lg font-bold text-slate-800">No matches</h3>
        <p class="text-md text-slate-500 mt-1">Try a different search term.</p>
      </div>

      <!-- Timeline Container -->
      <div class="py-5 px-5 flex flex-col relative z-10 min-h-full" id="notes-container"></div>

      <!-- Scroll FABs (Top & Bottom) -->
      <div class="fixed sm:absolute right-5 bottom-[128px] flex flex-col gap-3 z-30 pointer-events-none">
        <button id="scroll-top-fab" class="hidden fab-pop pointer-events-auto w-10 h-10 rounded-full bg-white border border-slate-200 shadow-lg text-indigo-600 items-center justify-center active:scale-90 transition-transform">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
        </button>
        <button id="scroll-bottom-fab" class="hidden fab-pop pointer-events-auto w-10 h-10 rounded-full bg-white border border-slate-200 shadow-lg text-indigo-600 items-center justify-center active:scale-90 transition-transform">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
        </button>
      </div>
    </main>

    <!-- Footer Input Bar -->
    <footer id="bottom-bar" class="border-b border-slate-200/80 relative bg-white shrink-0 z-40 px-5 pt-3 pb-safe transition-colors border-t border-slate-100 ">
      
      <!-- Clean Edit Mode Indicator -->
      <div id="edit-banner" class="hidden justify-between items-center px-2 pb-3">
        <span class="text-[12px] font-bold text-indigo-600 flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
          Editing Entry
        </span>
        <button type="button" id="cancel-edit-btn" class="text-[12px] font-bold text-slate-500 hover:text-slate-700 transition-colors">Cancel</button>
      </div>

      <form id="add-form" class="flex items-end gap-3 pb-3">
        <div class="flex-1 flex items-center transition-all relative">
          <textarea id="add-content" rows="1" required maxlength="2000" class="no-scrollbar block w-full px-4 py-3.5 text-[15px] text-slate-900 font-medium bg-slate-100/70 rounded-2xl border-none appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:bg-white transition-all placeholder:text-slate-400 placeholder:font-medium" placeholder="Enter Timeline..."></textarea>
          <span id="char-counter" class="hidden absolute -top-6 right-2 text-[10px] font-bold text-slate-400"></span>
        </div>
        <button type="submit" id="submit-btn" disabled class="mb-0.5 w-12 h-12 shrink-0 bg-indigo-600 text-white rounded-full flex items-center justify-center transition-all duration-300 shadow-md shadow-indigo-200 hover:shadow-lg hover:-translate-y-0.5 active:scale-95 disabled:opacity-50 disabled:hover:translate-y-0 disabled:active:scale-100 disabled:shadow-none disabled:cursor-not-allowed disabled:bg-slate-300">
          <svg id="submit-icon" class="w-5 h-5 ml-[2px]" viewBox="0 0 24 24">
             <path id="submit-icon-path" fill="currentColor" d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z" />
          </svg>
        </button>
      </form>
    </footer>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import {
      getDatabase, ref, onValue, push, set, update, remove,
      serverTimestamp, onChildAdded, onChildChanged, onChildRemoved,
      query, orderByChild
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBmXewXcQQt97EJzbKceLbCoTTG_9aJlJI",
      authDomain: "bhaskarjyoticlub.firebaseapp.com",
      databaseURL: "https://bhaskarjyoticlub-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "bhaskarjyoticlub"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const notesRef = ref(db, 'notes');

    /* ============ Toast System ============ */
    const toastContainer = document.getElementById('toast-container');
    function showToast(message, { type = 'default', actionLabel = null, onAction = null, duration = 3200 } = {}) {
      const colors = {
        default: 'bg-white text-slate-800 border border-slate-200 shadow-sm',
        success: 'bg-emerald-50 text-emerald-800 border border-emerald-200 shadow-sm',
        info: 'bg-indigo-50 text-indigo-800 border border-indigo-200 shadow-sm',
        delete: 'bg-rose-50 text-rose-800 border border-rose-200 shadow-sm'
      };
      
      const toast = document.createElement('div');
      toast.className = `toast-in pointer-events-auto max-w-full w-[90%] sm:w-auto flex items-center justify-between gap-3 ${colors[type] || colors.default} px-4 py-3 rounded-2xl shadow-xl text-[14px] font-semibold`;
      
      const span = document.createElement('span');
      span.className = 'flex-1 min-w-0 break-words';
      span.textContent = message;
      toast.appendChild(span);

      if (actionLabel && onAction) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `shrink-0 uppercase tracking-wide text-[12px] font-bold underline underline-offset-2 decoration-2 active:scale-95 transition-all ${type === 'delete' ? 'text-rose-700 hover:text-rose-900' : 'opacity-90 hover:opacity-100'}`;
        btn.textContent = actionLabel;
        btn.addEventListener('click', () => { onAction(); dismiss(); });
        toast.appendChild(btn);
      }

      let dismissed = false;
      function dismiss() {
        if (dismissed) return;
        dismissed = true;
        toast.classList.remove('toast-in');
        toast.classList.add('toast-out');
        setTimeout(() => toast.remove(), 250);
      }

      toastContainer.appendChild(toast);
      const timer = setTimeout(dismiss, duration);
      toast.addEventListener('click', (e) => { if (e.target === toast || e.target === span) { clearTimeout(timer); dismiss(); } });
      return dismiss;
    }

    /* ============ Network & Sync Status ============ */
    const statusDot = document.getElementById('main-status-dot');
    const statusText = document.getElementById('main-status-text');
    let connectionState = navigator.onLine === false ? 'offline' : 'connecting';
    let activeUploads = 0;

    const STATUS_META = {
      offline: { label: 'Offline • Saving Locally', dot: 'bg-slate-400', pulse: false },
      connecting: { label: 'Connecting...', dot: 'bg-amber-400', pulse: true },
      syncing: { label: 'Syncing Changes...', dot: 'bg-indigo-500', pulse: true },
      online: { label: 'Online & Synced', dot: 'bg-emerald-500', pulse: false }
    };

    function updateStatusUI() {
      let key = connectionState;
      if (connectionState === 'online' && activeUploads > 0) key = 'syncing';
      const meta = STATUS_META[key];
      statusDot.className = `w-2 h-2 rounded-full ${meta.dot}${meta.pulse ? ' animate-pulse' : ''}`;
      statusText.textContent = meta.label;
    }

    onValue(ref(db, '.info/connected'), (snap) => {
      connectionState = snap.val() ? 'online' : (navigator.onLine === false ? 'offline' : 'connecting');
      updateStatusUI();
    });
    window.addEventListener('online', () => { connectionState = 'connecting'; updateStatusUI(); });
    window.addEventListener('offline', () => { connectionState = 'offline'; updateStatusUI(); });

    function runSyncTask(promise, errorMessage = 'Action failed') {
      activeUploads++;
      updateStatusUI();
      return promise
        .catch((err) => {
          console.error(err);
          showToast(errorMessage, { type: 'delete', duration: 4000 });
          throw err;
        })
        .finally(() => {
          activeUploads--;
          updateStatusUI();
        });
    }

    function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

    /* ============ Header Menu & Search ============ */
    const menuBtn = document.getElementById('menu-btn');
    const dropdownMenu = document.getElementById('dropdown-menu');
    const menuDeleteAllBtn = document.getElementById('menu-delete-all-btn');
    
    const searchInput = document.getElementById('search-input');
    const searchClearBtn = document.getElementById('search-clear-btn');
    let searchQuery = '';

    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!dropdownMenu.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) {
        dropdownMenu.classList.add('hidden');
      }
    });

    searchInput.addEventListener('input', () => {
      searchClearBtn.classList.toggle('hidden', !searchInput.value);
      searchClearBtn.classList.toggle('flex', !!searchInput.value);
      applySearch(searchInput.value.trim().toLowerCase());
    });
    
    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchClearBtn.classList.add('hidden');
      searchInput.focus();
      applySearch('');
    });

    function applySearch(q) {
      searchQuery = q;
      const items = document.querySelectorAll('.timeline-item');
      let anyVisible = false;
      items.forEach(item => {
        const match = !q || (item.dataset.content || '').includes(q);
        item.classList.toggle('hidden', !match);
        if (match) anyVisible = true;
      });

      const noResultsState = document.getElementById('no-results-state');
      if (isInitialDataLoaded && q && !anyVisible && items.length > 0) {
        noResultsState.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        noResultsState.classList.add('opacity-0', 'pointer-events-none');
      }
      updateEmptyState();
    }

    menuDeleteAllBtn.addEventListener('click', () => {
      dropdownMenu.classList.add('hidden');
      if (confirm("Are you sure you want to delete ALL entries? This action cannot be undone.")) {
         runSyncTask(remove(notesRef), "Failed to clear entries")
           .then(() => {
              vibrate(15);
              showToast("All entries deleted", { type: 'delete' });
           });
      }
    });

    /* ============ Input State & Form ============ */
    const textarea = document.getElementById('add-content');
    const submitBtn = document.getElementById('submit-btn');
    const submitIconPath = document.getElementById('submit-icon-path');
    const charCounter = document.getElementById('char-counter');
    const editBanner = document.getElementById('edit-banner');
    const cancelEditBtn = document.getElementById('cancel-edit-btn');
    
    const appHeader = document.getElementById('app-header');
    const mainScroll = document.getElementById('scroll-container');

    const DRAFT_KEY = 'timeline-draft';
    let currentEditId = null;

    function updateCharCounter() {
      const len = textarea.value.length;
      if (len > 1500) {
        charCounter.textContent = `${len}/2000`;
        charCounter.classList.remove('hidden');
        charCounter.classList.toggle('text-rose-500', len >= 1950);
      } else {
        charCounter.classList.add('hidden');
      }
    }

    textarea.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
      submitBtn.disabled = !this.value.trim();
      updateCharCounter();
      if (!currentEditId) {
        try { localStorage.setItem(DRAFT_KEY, this.value); } catch (e) {}
      }
    });

    try {
      const savedDraft = localStorage.getItem(DRAFT_KEY);
      if (savedDraft) {
        textarea.value = savedDraft;
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
        submitBtn.disabled = false;
      }
    } catch (e) {}

    function exitEditMode() {
      currentEditId = null;
      textarea.value = '';
      try { const d = localStorage.getItem(DRAFT_KEY); if(d) textarea.value = d; } catch(e){}
      
      editBanner.classList.add('hidden');
      editBanner.classList.remove('flex');
      
      // Remove Backdrop Blur
      appHeader.classList.remove('blur-backdrop');
      mainScroll.classList.remove('blur-backdrop');
      
      // Restore send icon
      submitIconPath.setAttribute('d', 'M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z');
      submitIconPath.removeAttribute('stroke');
      submitIconPath.removeAttribute('stroke-width');
      submitIconPath.removeAttribute('stroke-linecap');
      submitIconPath.removeAttribute('stroke-linejoin');
      submitIconPath.setAttribute('fill', 'currentColor');
      
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
      submitBtn.disabled = !textarea.value.trim();
    }

    cancelEditBtn.addEventListener('click', exitEditMode);

    document.getElementById('add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = textarea.value.trim();
      if (!val) return;

      if (currentEditId) {
        runSyncTask(update(ref(db, `notes/${currentEditId}`), { content: val }), "Couldn't save edit")
          .then(() => { showToast('Entry updated', { type: 'success', duration: 2000 }); exitEditMode(); });
      } else {
        const payload = { content: val, timestamp: serverTimestamp() };
        const newRef = push(notesRef);
        runSyncTask(set(newRef, payload), "Couldn't save entry")
          .then(() => { vibrate(8); });
        
        textarea.value = '';
        textarea.style.height = 'auto';
        submitBtn.disabled = true;
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      }
      textarea.focus();
    });

    /* ============ Delete & strict undo logic ============ */
    function deleteNoteById(id) {
      if (!id) return;
      const cached = noteCache.get(id);
      
      runSyncTask(remove(ref(db, `notes/${id}`)), "Couldn't delete entry")
      .then(() => {
        vibrate(10);
        showToast('Timeline entry deleted', {
          type: 'delete',
          actionLabel: 'Undo',
          duration: 5000,
          onAction: () => {
            if (cached) {
              // Ensure we re-push with the EXACT cached timestamp integer to strictly undo to original time
              const restorePayload = { content: cached.content, timestamp: cached.timestamp || Date.now() };
              runSyncTask(set(ref(db, `notes/${id}`), restorePayload), "Couldn't restore entry")
                .then(() => showToast('Entry restored', { type: 'success', duration: 2000 }));
            }
          }
        });
      });
    }

    /* ============ Utility: Generate deterministic color from string ============ */
    function getCardColors(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
         hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      const hue = Math.abs(hash) % 360;
      return {
        bg: `hsl(${hue}, 70%, 96%)`, // Bright pastel background
        border: `hsl(${hue}, 60%, 82%)` // Slightly darker variant for the border
      };
    }

    /* ============ Swipe Interface (Two-Step Action) ============ */
    function attachSwipeInteractions(wrapperEl, id, content) {
      const cardEl = wrapperEl.querySelector('.swipe-card');
      const bgDel = wrapperEl.querySelector('.bg-delete');
      const bgEdit = wrapperEl.querySelector('.bg-edit');
      const btnDel = wrapperEl.querySelector('.btn-delete');
      const btnEdit = wrapperEl.querySelector('.btn-edit');

      let startX = 0, currentX = 0, dragging = false;
      let decided = false, horizontal = false;
      let lockedState = null; // 'delete', 'edit', null

      function resetSwipe() {
        lockedState = null;
        cardEl.style.transform = 'translateX(0)';
        bgDel.style.opacity = '0';
        bgEdit.style.opacity = '0';
      }

      cardEl.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (lockedState) { resetSwipe(); return; }
        startX = e.clientX;
        dragging = true;
        decided = false;
        horizontal = false;
        cardEl.style.transition = 'none';
      });

      cardEl.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;

        if (!decided) {
          if (Math.abs(dx) > 8) {
            decided = true;
            horizontal = true;
            try { cardEl.setPointerCapture(e.pointerId); } catch(err){}
          }
        }

        if (decided && horizontal) {
          e.preventDefault();
          currentX = dx;
          // Dampen pull past max bounds
          if (currentX > 110) currentX = 110 + (currentX - 110) * 0.15;
          if (currentX < -110) currentX = -110 + (currentX + 110) * 0.15;

          cardEl.style.transform = `translateX(${currentX}px)`;
          bgDel.style.opacity = currentX > 20 ? '1' : '0';
          bgEdit.style.opacity = currentX < -20 ? '1' : '0';
        }
      });

      const endDrag = (e) => {
        if (!dragging) return;
        dragging = false;
        if (decided && horizontal) {
          try { cardEl.releasePointerCapture(e.pointerId); } catch(err){}
          cardEl.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)';
          
          if (currentX > 75) {
            lockedState = 'delete';
            cardEl.style.transform = 'translateX(96px)';
          } else if (currentX < -75) {
            lockedState = 'edit';
            cardEl.style.transform = 'translateX(-96px)';
          } else {
            resetSwipe();
          }
        }
        currentX = 0;
      };

      cardEl.addEventListener('pointerup', endDrag);
      cardEl.addEventListener('pointercancel', endDrag);

      // Listeners for revealed buttons
      btnDel.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteNoteById(id);
        resetSwipe();
      });

      btnEdit.addEventListener('click', (e) => {
        e.stopPropagation();
        resetSwipe();
        
        // Enter edit mode
        currentEditId = id;
        textarea.value = content;
        editBanner.classList.remove('hidden');
        editBanner.classList.add('flex');
        
        // Add Backdrop Blur Focus
        appHeader.classList.add('blur-backdrop');
        mainScroll.classList.add('blur-backdrop');
        
        // Transform button icon to Checkmark
        submitIconPath.setAttribute('d', 'M5 13l4 4L19 7');
        submitIconPath.setAttribute('stroke', 'currentColor');
        submitIconPath.setAttribute('stroke-width', '2.5');
        submitIconPath.setAttribute('stroke-linecap', 'round');
        submitIconPath.setAttribute('stroke-linejoin', 'round');
        submitIconPath.setAttribute('fill', 'none');
        
        updateCharCounter();
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
        submitBtn.disabled = false;
        textarea.focus();
      });
    }

    /* ============ Rendering & State ============ */
    const container = document.getElementById('notes-container');
    const scrollContainer = document.getElementById('scroll-container');
    const emptyState = document.getElementById('empty-state');
    const loadingState = document.getElementById('loading-state');
    
    // Top & Bottom FAB refs
    const scrollTopFab = document.getElementById('scroll-top-fab');
    const scrollBottomFab = document.getElementById('scroll-bottom-fab');

    let isInitialDataLoaded = false;
    let scrollTimeout;
    let noteCache = new Map();

    onValue(notesRef, (snap) => {
      if (!isInitialDataLoaded) {
        isInitialDataLoaded = true;
        loadingState.classList.add('opacity-0');
        setTimeout(() => { loadingState.remove(); updateEmptyState(); }, 300);
      }
    }, { onlyOnce: true });

    function updateEmptyState() {
      if (!isInitialDataLoaded) return;
      if (noteCache.size > 0) {
        emptyState.classList.add('opacity-0', 'pointer-events-none');
      } else {
        emptyState.classList.remove('opacity-0', 'pointer-events-none');
        document.getElementById('no-results-state').classList.add('opacity-0', 'pointer-events-none');
      }
    }

    const scrollToTop = (smooth = true) => {
      scrollContainer.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
    };

    const scrollToBottom = (smooth = true) => {
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        scrollContainer.scrollTo({ top: scrollContainer.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
      }, 100);
    };

    function isNearBottom() {
      return scrollContainer.scrollHeight - scrollContainer.scrollTop - scrollContainer.clientHeight < 150;
    }
    
    function isNearTop() {
      return scrollContainer.scrollTop < 150;
    }

    scrollContainer.addEventListener('scroll', () => {
      if (isNearTop()) { 
         scrollTopFab.classList.add('hidden'); 
         scrollTopFab.classList.remove('flex'); 
      } else { 
         scrollTopFab.classList.remove('hidden'); 
         scrollTopFab.classList.add('flex'); 
      }

      if (isNearBottom()) { 
         scrollBottomFab.classList.add('hidden'); 
         scrollBottomFab.classList.remove('flex'); 
      } else { 
         scrollBottomFab.classList.remove('hidden'); 
         scrollBottomFab.classList.add('flex'); 
      }
    });

    scrollTopFab.addEventListener('click', () => scrollToTop(true));
    scrollBottomFab.addEventListener('click', () => scrollToBottom(true));

    /* ============ Firebase Realtime Listeners ============ */
    onChildAdded(query(notesRef, orderByChild('timestamp')), (data) => {
      const note = { id: data.key, ...data.val() };
      noteCache.set(note.id, { content: note.content, timestamp: note.timestamp });

      const dateObj = note.timestamp ? new Date(note.timestamp) : new Date();
      const dateStr = dateObj.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const timeStr = dateObj.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });

      const itemDiv = document.createElement('div');
      itemDiv.className = 'timeline-item relative w-full z-10 animate-grow mb-4 swipe-container group';
      itemDiv.id = `note-${note.id}`;
      itemDiv.dataset.date = dateStr;
      itemDiv.dataset.content = (note.content || '').toLowerCase();
      
      const { bg: cardBgColor, border: cardBorderColor } = getCardColors(note.id);

      // Card UI with dynamic colored border matching the background
      itemDiv.innerHTML = `
        <div class="relative w-full overflow-hidden rounded-2xl shadow-sm border" style="border-color: ${cardBorderColor};">
          
          <!-- Background Action Drawers -->
          <div class="absolute inset-0 flex justify-between bg-slate-100 z-0">
             <div class="w-1/2 flex items-center pl-4 bg-delete transition-opacity duration-200 opacity-0">
                <button class="btn-delete flex flex-col items-center justify-center gap-1 text-rose-600 font-bold w-16 h-16 rounded-2xl bg-white hover:bg-rose-50 border border-rose-100 active:scale-95 transition-all shadow-sm">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                  <span class="text-[10px]">Delete</span>
                </button>
             </div>
             <div class="w-1/2 flex items-center justify-end pr-4 bg-edit transition-opacity duration-200 opacity-0">
                <button class="btn-edit flex flex-col items-center justify-center gap-1 text-indigo-600 font-bold w-16 h-16 rounded-2xl bg-white hover:bg-indigo-50 border border-indigo-100 active:scale-95 transition-all shadow-sm">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                  <span class="text-[10px]">Edit</span>
                </button>
             </div>
          </div>

          <!-- Foreground Swipeable Card -->
          <div class="swipe-card relative z-10 px-5 pt-3.5 pb-4 w-full rounded-2xl transform transition-transform" style="background-color: ${cardBgColor}">
            <!-- Date & Time Top Row -->
            <div class="flex justify-between items-center mb-2.5 pb-2.5 border-b border-black/5">
              <span class="text-[12px] font-bold text-slate-600/80 tracking-wide uppercase">${dateStr}</span>
              <span class="text-[12px] font-bold text-slate-600/80">${timeStr}</span>
            </div>
            
            <!-- Content -->
            <div class="text-left">
              <p id="text-${note.id}" class="text-[15.5px] text-slate-800 font-medium leading-relaxed whitespace-pre-wrap break-words select-none"></p>
            </div>
          </div>

        </div>`;

      const pTag = itemDiv.querySelector(`#text-${note.id}`);
      pTag.textContent = note.content;

      attachSwipeInteractions(itemDiv, note.id, note.content);

      // Insert matching strict chronological ordering (if items restore via undo)
      const existingItems = Array.from(container.querySelectorAll('.timeline-item'));
      const timestampValue = note.timestamp || Date.now();
      itemDiv.dataset.ts = timestampValue;
      
      let inserted = false;
      for(let existing of existingItems) {
        if(parseInt(existing.dataset.ts) > timestampValue) {
          container.insertBefore(itemDiv, existing);
          inserted = true;
          break;
        }
      }
      if(!inserted) {
         container.appendChild(itemDiv);
      }

      if (searchQuery && !itemDiv.dataset.content.includes(searchQuery)) itemDiv.classList.add('hidden');
      
      updateEmptyState();
      if (isNearBottom() || !isInitialDataLoaded) scrollToBottom(isInitialDataLoaded);
    });

    onChildChanged(notesRef, (data) => {
      const note = { id: data.key, ...data.val() };
      noteCache.set(note.id, { content: note.content, timestamp: note.timestamp });
      
      const itemDiv = document.getElementById(`note-${data.key}`);
      const pTag = document.getElementById(`text-${data.key}`);
      if (pTag) pTag.textContent = note.content;
      if (itemDiv) {
        itemDiv.dataset.content = (note.content || '').toLowerCase();
        // Re-attach swipe with new content for edit payload
        const swipeWrapper = itemDiv.querySelector('.relative.w-full.overflow-hidden');
        if(swipeWrapper) {
           const oldClone = swipeWrapper.cloneNode(true);
           swipeWrapper.parentNode.replaceChild(oldClone, swipeWrapper);
           attachSwipeInteractions(itemDiv, note.id, note.content);
        }
        if (searchQuery) applySearch(searchQuery);
      }
    });

    onChildRemoved(notesRef, (data) => {
      noteCache.delete(data.key);
      const itemDiv = document.getElementById(`note-${data.key}`);
      if (itemDiv) itemDiv.remove();

      if (searchQuery) applySearch(searchQuery);
      updateEmptyState();
    });

    /* ============ PWA Service Worker Registration ============ */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((registration) => {
          console.log('PWA ServiceWorker registered with scope:', registration.scope);
        }).catch((error) => {
          console.error('ServiceWorker registration failed:', error);
        });
      });
    }

  </script>
</body>
</html>
