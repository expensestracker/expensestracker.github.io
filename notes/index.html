<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1F21" media="(prefers-color-scheme: dark)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Timelines</title>
  <meta name="description" content="Log and track your daily Timeline in real-time.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192x192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Hide scrollbar for clean app-like UI */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    :root { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; }
    body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; }

    /* Chrome scroll overflow & viewport fix */
    html, body {
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
      overscroll-behavior: none;
      width: 100%;
      margin: 0;
      padding: 0;
      touch-action: pan-x pan-y;
    }

    /* Safe area padding utilities */
    .pt-safe { padding-top: max(0.6rem, env(safe-area-inset-top, 0px)); }
    .pb-safe { padding-bottom: max(0.6rem, env(safe-area-inset-bottom, 0px)); }

    /* Animations - Refined with subtle spring effect */
    @keyframes smoothGrow {
      0%   { opacity: 0; transform: translateY(16px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-grow { opacity: 0; animation: smoothGrow 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards; }

    @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    .shimmer {
      background: linear-gradient(90deg, #f0f3f8 25%, #e2e8f0 37%, #f0f3f8 63%);
      background-size: 800px 100%;
      animation: shimmer 1.6s linear infinite;
    }

    /* Bottom Toast Notifications */
    @keyframes toastBottomIn { 0% { opacity: 0; transform: translateY(24px) scale(0.92); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toastBottomOut { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(24px) scale(0.92); } }
    .toast-in { animation: toastBottomIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards; }
    .toast-out { animation: toastBottomOut 0.25s ease forwards; }

    /* Menu dropdown */
    @keyframes popoverIn { 0% { opacity: 0; transform: translateY(-8px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    .menu-in { transform-origin: top right; animation: popoverIn 0.2s cubic-bezier(0.16,1,0.3,1) forwards; }

    /* FAB */
    @keyframes popIn { 0% { opacity: 0; transform: translateY(8px) scale(0.8); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    .fab-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards; }

    /* Better focus rings */
    textarea:focus, input:focus, button:focus-visible { outline: none; }
    ::selection { background: #c7d2fe; color: #1e1b4b; }

    /* Swipe Logic Fixes */
    .swipe-container { touch-action: pan-y; }

    /* Smooth transition for backdrop blur */
    .blur-backdrop {
      filter: blur(5px) brightness(0.95);
      opacity: 0.8;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .blur-transition {
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-slate-50 flex items-center justify-center h-full text-slate-800 font-sans overflow-hidden overscroll-none w-full">

  <div class="w-full max-w-md h-full sm:h-[850px] bg-gray-50 sm:rounded-[2.5rem] sm:border border-slate-200/60 relative overflow-clip flex flex-col overscroll-none shadow-2xl">

    <!-- Bottom Toast Container -->
    <div id="toast-container" class="absolute left-0 right-0 bottom-[96px] z-[100] flex flex-col-reverse items-center gap-2.5 px-5 pointer-events-none"></div>

    <!-- Header -->
    <header id="app-header" class="bg-slate-50 backdrop-blur-2xl backdrop-saturate-200 z-40 sticky top-0 pt-safe border-b border-slate-200/80 shrink-0 blur-transition shadow-sm">
      <div class="px-5 py-2.5 flex justify-between items-center">
        <div class="min-w-0">
          <h1 class="text-[20px] font-black text-slate-900 leading-tight tracking-tight flex items-center gap-2">
            Timeline
          </h1>
          <div class="flex items-center gap-1.5 mt-[1px]">
            <span id="main-status-dot" class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
            <span id="main-status-text" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Connecting...</span>
          </div>
        </div>
        
        <div class="flex items-center relative">
          <!-- Menu Button -->
          <button id="menu-btn" type="button" aria-label="Menu" class="w-9 h-9 flex items-center justify-center rounded-full bg-white border border-slate-200/80 text-slate-600 hover:text-indigo-600 hover:border-indigo-300 hover:bg-indigo-50 active:scale-90 transition-all shadow-sm">
            <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
          </button>

          <!-- Dropdown Menu -->
          <div id="dropdown-menu" class="hidden absolute right-0 top-11 w-56 bg-white rounded-2xl border border-slate-200/80 shadow-2xl z-50 py-1.5 menu-in">
            <button id="menu-delete-all-btn" class="w-full flex items-center gap-3 px-4 py-3 text-left text-[14px] font-bold text-rose-600 hover:bg-rose-50 transition-colors">
              <div class="w-7 h-7 rounded-full bg-rose-100 flex items-center justify-center shrink-0">
                <svg class="w-4 h-4 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </div>
              Delete All Entries
            </button>
          </div>
        </div>
      </div>

      <!-- Always-on Search Row -->
      <div id="search-row" class="px-5 pb-3">
        <div class="relative group">
          <svg class="w-[16px] h-[16px] text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none transition-colors group-focus-within:text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z"/></svg>
          <input id="search-input" type="text" placeholder="Search entries..." class="w-full pl-9 pr-10 py-2.5 text-[14px] font-medium bg-white border border-slate-200/80 rounded-2xl focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50 transition-all placeholder:text-slate-400 shadow-sm">
          <button id="search-clear-btn" type="button" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-slate-100 text-slate-500 items-center justify-center hover:bg-slate-200 hover:text-slate-700 active:scale-90 transition-all">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto no-scrollbar relative scroll-smooth overscroll-contain bg-gray-50 blur-transition" id="scroll-container">

      <!-- Skeleton Loading State -->
      <div id="loading-state" class="absolute inset-0 z-30 transition-opacity duration-300 pointer-events-none bg-gray-50">
        <div class="px-5 py-6 flex flex-col gap-6">
           <!-- Date Header -->
           <div class="flex items-baseline gap-3 mb-1 mt-1">
              <div class="h-6 w-28 rounded-md shimmer"></div>
              <div class="h-4 w-32 rounded-md shimmer opacity-60"></div>
           </div>
           
           <!-- Skeleton Timeline Row 1 -->
           <div class="flex items-start relative w-full h-24 mb-5">
              <!-- Gutter Line -->
              <div class="absolute top-[26px] bottom-[-37px] left-[11px] w-[2px] bg-slate-200/70"></div>
              <!-- Node -->
              <div class="relative z-10 w-[24px] flex-shrink-0 flex justify-center mt-[18px]">
                 <div class="w-4 h-4 rounded-full border-[3px] border-slate-200 bg-white"></div>
              </div>
              <!-- Time -->
              <div class="relative z-10 w-[68px] flex-shrink-0 mt-[20px] text-center pr-2">
                 <div class="h-3 w-10 rounded shimmer mx-auto"></div>
              </div>
              <!-- Card -->
              <div class="relative z-10 flex-1 min-w-0 h-full rounded-2xl shimmer border border-slate-200/80 opacity-80"></div>
           </div>
           
           <!-- Skeleton Timeline Row 2 -->
           <div class="flex items-start relative w-full h-32 mb-5">
              <div class="relative z-10 w-[24px] flex-shrink-0 flex justify-center mt-[18px]">
                 <div class="w-4 h-4 rounded-full border-[3px] border-slate-200 bg-white"></div>
              </div>
              <div class="relative z-10 w-[68px] flex-shrink-0 mt-[20px] text-center pr-2">
                 <div class="h-3 w-10 rounded shimmer mx-auto"></div>
              </div>
              <div class="relative z-10 flex-1 min-w-0 h-full rounded-2xl shimmer border border-slate-200/80 opacity-60"></div>
           </div>
        </div>
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center z-20 transition-opacity duration-300 opacity-0 pointer-events-none text-center px-8">
        <div class="w-20 h-20 bg-white rounded-full border border-slate-100 shadow-sm ring-8 ring-slate-50 flex items-center justify-center mb-5 text-slate-300">
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
        </div>
        <h3 class="text-[19px] font-extrabold text-slate-800 tracking-tight">No entries yet</h3>
        <p class="text-[15px] text-slate-500 mt-1.5 font-medium">Log your first timeline event below.</p>
      </div>

      <!-- No Results State -->
      <div id="no-results-state" class="absolute inset-0 flex flex-col items-center justify-center z-20 transition-opacity duration-300 opacity-0 pointer-events-none text-center px-8">
        <div class="w-20 h-20 bg-white rounded-full border border-slate-100 shadow-sm ring-8 ring-slate-50 flex items-center justify-center mb-5 text-slate-300">
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z"/></svg>
        </div>
        <h3 class="text-[19px] font-extrabold text-slate-800 tracking-tight">No matches found</h3>
        <p class="text-[15px] text-slate-500 mt-1.5 font-medium">Try a different search term.</p>
      </div>

      <!-- Timeline Container -->
      <div class="py-5 pl-4 pr-5 flex flex-col relative z-10 min-h-full" id="notes-container"></div>

      <!-- Scroll FABs (Top & Bottom) -->
      <div class="fixed sm:absolute right-5 bottom-[108px] flex flex-col gap-3 z-30 pointer-events-none">
        <button id="scroll-top-fab" class="hidden fab-pop pointer-events-auto w-10 h-10 rounded-full bg-white border border-slate-200/80 shadow-lg shadow-slate-200/50 text-indigo-600 items-center justify-center hover:bg-slate-50 hover:scale-105 active:scale-95 transition-all">
          <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
        </button>
        <button id="scroll-bottom-fab" class="hidden fab-pop pointer-events-auto w-10 h-10 rounded-full bg-white border border-slate-200/80 shadow-lg shadow-slate-200/50 text-indigo-600 items-center justify-center hover:bg-slate-50 hover:scale-105 active:scale-95 transition-all">
          <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
        </button>
      </div>
    </main>

    <!-- Footer Input Bar -->
    <footer id="bottom-bar" class="border-b border-slate-200/80 relative bg-slate-50 shrink-0 z-40 px-5 pt-2.5 pb-safe transition-colors border-t border-slate-200/80 shadow-[0_-8px_30px_rgba(0,0,0,0.04)]">
      
      <!-- Clean Edit Mode Indicator -->
      <div id="edit-banner" class="hidden justify-between items-center px-1 pb-2.5">
        <span class="text-[12px] font-extrabold text-indigo-600 flex items-center gap-1.5 tracking-wide uppercase">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
          Editing Entry
        </span>
        <button type="button" id="cancel-edit-btn" class="text-[12px] font-bold text-slate-500 hover:text-slate-800 bg-slate-200/50 px-2.5 py-0.5 rounded-full transition-colors">Cancel</button>
      </div>

      <form id="add-form" class="flex items-end gap-2.5 pb-2.5">
        <div class="flex-1 flex items-center transition-all relative">
          <textarea id="add-content" rows="1" required maxlength="2000" class="no-scrollbar block w-full px-4 py-3 text-[14.5px] text-slate-800 font-medium bg-white rounded-3xl border border-slate-200/80 shadow-sm appearance-none focus:outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50 transition-all placeholder:text-slate-400 placeholder:font-medium leading-relaxed" placeholder="Add to timeline..."></textarea>
          <span id="char-counter" class="hidden absolute -top-5 right-3 text-[10px] font-bold text-slate-400 bg-gray-50 px-2 rounded-full"></span>
        </div>
        <button type="submit" id="submit-btn" disabled class="mb-[3px] w-11 h-11 shrink-0 bg-slate-900 text-white rounded-full flex items-center justify-center transition-all duration-300 shadow-lg shadow-slate-900/20 hover:shadow-xl hover:-translate-y-0.5 active:scale-95 disabled:opacity-40 disabled:hover:translate-y-0 disabled:active:scale-100 disabled:shadow-none disabled:cursor-not-allowed disabled:bg-slate-400">
          <svg id="submit-icon" class="w-[18px] h-[18px] ml-[2px]" viewBox="0 0 24 24">
             <path id="submit-icon-path" fill="currentColor" d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z" />
          </svg>
        </button>
      </form>
    </footer>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import {
      getDatabase, ref, onValue, push, set, update, remove,
      serverTimestamp, onChildAdded, onChildChanged, onChildRemoved,
      query, orderByChild
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBmXewXcQQt97EJzbKceLbCoTTG_9aJlJI",
      authDomain: "bhaskarjyoticlub.firebaseapp.com",
      databaseURL: "https://bhaskarjyoticlub-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "bhaskarjyoticlub"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const notesRef = ref(db, 'notes');

    /* ============ Toast System ============ */
    const toastContainer = document.getElementById('toast-container');
    function showToast(message, { type = 'default', actionLabel = null, onAction = null, duration = 3200 } = {}) {
      const colors = {
        default: 'bg-white text-slate-800 border-slate-200/80',
        success: 'bg-emerald-50 text-emerald-900 border-emerald-200/80',
        info: 'bg-indigo-50 text-indigo-900 border-indigo-200/80',
        delete: 'bg-rose-50 text-rose-900 border-rose-200/80'
      };
      
      const toast = document.createElement('div');
      toast.className = `toast-in pointer-events-auto max-w-full w-[90%] sm:w-auto flex items-center justify-between gap-4 border shadow-xl shadow-slate-200/50 px-5 py-3 rounded-2xl text-[14px] font-bold ${colors[type] || colors.default}`;
      
      const span = document.createElement('span');
      span.className = 'flex-1 min-w-0 break-words';
      span.textContent = message;
      toast.appendChild(span);

      if (actionLabel && onAction) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `shrink-0 uppercase tracking-wider text-[12px] font-extrabold underline underline-offset-4 decoration-2 active:scale-95 transition-all ${type === 'delete' ? 'text-rose-700 hover:text-rose-900' : 'text-slate-600 hover:text-slate-900'}`;
        btn.textContent = actionLabel;
        btn.addEventListener('click', () => { onAction(); dismiss(); });
        toast.appendChild(btn);
      }

      let dismissed = false;
      function dismiss() {
        if (dismissed) return;
        dismissed = true;
        toast.classList.remove('toast-in');
        toast.classList.add('toast-out');
        setTimeout(() => toast.remove(), 250);
      }

      toastContainer.appendChild(toast);
      const timer = setTimeout(dismiss, duration);
      toast.addEventListener('click', (e) => { if (e.target === toast || e.target === span) { clearTimeout(timer); dismiss(); } });
      return dismiss;
    }

    /* ============ Network & Sync Status ============ */
    const statusDot = document.getElementById('main-status-dot');
    const statusText = document.getElementById('main-status-text');
    let connectionState = navigator.onLine === false ? 'offline' : 'connecting';
    let activeUploads = 0;

    const STATUS_META = {
      offline: { label: 'Offline • Saving Locally', dot: 'bg-slate-400', pulse: false },
      connecting: { label: 'Connecting...', dot: 'bg-amber-400', pulse: true },
      syncing: { label: 'Syncing Changes...', dot: 'bg-indigo-500', pulse: true },
      online: { label: 'Online & Synced', dot: 'bg-emerald-500', pulse: false }
    };

    function updateStatusUI() {
      let key = connectionState;
      if (connectionState === 'online' && activeUploads > 0) key = 'syncing';
      const meta = STATUS_META[key];
      statusDot.className = `w-1.5 h-1.5 rounded-full ${meta.dot}${meta.pulse ? ' animate-pulse' : ''}`;
      statusText.textContent = meta.label;
    }

    onValue(ref(db, '.info/connected'), (snap) => {
      connectionState = snap.val() ? 'online' : (navigator.onLine === false ? 'offline' : 'connecting');
      updateStatusUI();
    });
    window.addEventListener('online', () => { connectionState = 'connecting'; updateStatusUI(); });
    window.addEventListener('offline', () => { connectionState = 'offline'; updateStatusUI(); });

    function runSyncTask(promise, errorMessage = 'Action failed') {
      activeUploads++;
      updateStatusUI();
      return promise
        .catch((err) => {
          console.error(err);
          showToast(errorMessage, { type: 'delete', duration: 4000 });
          throw err;
        })
        .finally(() => {
          activeUploads--;
          updateStatusUI();
        });
    }

    function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

    /* ============ Header Menu & Search ============ */
    const menuBtn = document.getElementById('menu-btn');
    const dropdownMenu = document.getElementById('dropdown-menu');
    const menuDeleteAllBtn = document.getElementById('menu-delete-all-btn');
    
    const searchInput = document.getElementById('search-input');
    const searchClearBtn = document.getElementById('search-clear-btn');
    let searchQuery = '';

    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!dropdownMenu.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) {
        dropdownMenu.classList.add('hidden');
      }
    });

    searchInput.addEventListener('input', () => {
      searchClearBtn.classList.toggle('hidden', !searchInput.value);
      searchClearBtn.classList.toggle('flex', !!searchInput.value);
      applySearch(searchInput.value.trim().toLowerCase());
    });
    
    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchClearBtn.classList.add('hidden');
      searchInput.focus();
      applySearch('');
    });

    function applySearch(q) {
      searchQuery = q;
      const items = document.querySelectorAll('.timeline-item');
      let anyVisible = false;
      items.forEach(item => {
        const match = !q || (item.dataset.content || '').includes(q);
        item.classList.toggle('hidden', !match);
        if (match) anyVisible = true;
      });

      const noResultsState = document.getElementById('no-results-state');
      if (isInitialDataLoaded && q && !anyVisible && items.length > 0) {
        noResultsState.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        noResultsState.classList.add('opacity-0', 'pointer-events-none');
      }
      updateEmptyState();
      updateDateHeaders();
    }

    menuDeleteAllBtn.addEventListener('click', () => {
      dropdownMenu.classList.add('hidden');
      if (confirm("Are you sure you want to delete ALL entries? This action cannot be undone.")) {
         runSyncTask(remove(notesRef), "Failed to clear entries")
           .then(() => {
              vibrate(15);
              showToast("All entries deleted", { type: 'delete' });
           });
      }
    });

    /* ============ Input State & Form ============ */
    const textarea = document.getElementById('add-content');
    const submitBtn = document.getElementById('submit-btn');
    const submitIconPath = document.getElementById('submit-icon-path');
    const charCounter = document.getElementById('char-counter');
    const editBanner = document.getElementById('edit-banner');
    const cancelEditBtn = document.getElementById('cancel-edit-btn');
    
    const appHeader = document.getElementById('app-header');
    const mainScroll = document.getElementById('scroll-container');

    const DRAFT_KEY = 'timeline-draft';
    let currentEditId = null;

    function updateCharCounter() {
      const len = textarea.value.length;
      if (len > 1500) {
        charCounter.textContent = `${len}/2000`;
        charCounter.classList.remove('hidden');
        charCounter.classList.toggle('text-rose-500', len >= 1950);
      } else {
        charCounter.classList.add('hidden');
      }
    }

    textarea.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
      submitBtn.disabled = !this.value.trim();
      updateCharCounter();
      if (!currentEditId) {
        try { localStorage.setItem(DRAFT_KEY, this.value); } catch (e) {}
      }
    });

    try {
      const savedDraft = localStorage.getItem(DRAFT_KEY);
      if (savedDraft) {
        textarea.value = savedDraft;
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
        submitBtn.disabled = false;
      }
    } catch (e) {}

    function exitEditMode() {
      currentEditId = null;
      textarea.value = '';
      try { const d = localStorage.getItem(DRAFT_KEY); if(d) textarea.value = d; } catch(e){}
      
      editBanner.classList.add('hidden');
      editBanner.classList.remove('flex');
      
      appHeader.classList.remove('blur-backdrop');
      mainScroll.classList.remove('blur-backdrop');
      
      submitIconPath.setAttribute('d', 'M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z');
      submitIconPath.removeAttribute('stroke');
      submitIconPath.removeAttribute('stroke-width');
      submitIconPath.removeAttribute('stroke-linecap');
      submitIconPath.removeAttribute('stroke-linejoin');
      submitIconPath.setAttribute('fill', 'currentColor');
      
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
      submitBtn.disabled = !textarea.value.trim();
    }

    cancelEditBtn.addEventListener('click', exitEditMode);

    document.getElementById('add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = textarea.value.trim();
      if (!val) return;

      if (currentEditId) {
        runSyncTask(update(ref(db, `notes/${currentEditId}`), { content: val }), "Couldn't save edit")
          .then(() => { showToast('Entry updated successfully', { type: 'success', duration: 2000 }); exitEditMode(); });
      } else {
        const payload = { content: val, timestamp: serverTimestamp() };
        const newRef = push(notesRef);
        runSyncTask(set(newRef, payload), "Couldn't save entry")
          .then(() => { vibrate(8); });
        
        textarea.value = '';
        textarea.style.height = 'auto';
        submitBtn.disabled = true;
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      }
      textarea.focus();
    });

    /* ============ Delete & strict undo logic ============ */
    function deleteNoteById(id) {
      if (!id) return;
      const cached = noteCache.get(id);
      
      runSyncTask(remove(ref(db, `notes/${id}`)), "Couldn't delete entry")
      .then(() => {
        vibrate(10);
        showToast('Timeline entry deleted', {
          type: 'delete',
          actionLabel: 'Undo',
          duration: 5000,
          onAction: () => {
            if (cached) {
              const restorePayload = { content: cached.content, timestamp: cached.timestamp || Date.now() };
              runSyncTask(set(ref(db, `notes/${id}`), restorePayload), "Couldn't restore entry")
                .then(() => showToast('Entry restored', { type: 'success', duration: 2000 }));
            }
          }
        });
      });
    }

    /* ============ Utility: Refined Pastel Backgrounds ============ */
    const CARD_COLORS = [
      { bg: '#F0FAF9', border: '#BEE5DF' }, // Light Teal
      { bg: '#FFFDF5', border: '#F8E7B2' }, // Light Yellow
      { bg: '#F8F6FC', border: '#DCD0F4' }, // Light Purple
      { bg: '#FEF6F9', border: '#F5C6D9' }, // Light Pink
      { bg: '#FFFAF6', border: '#F8D7BE' }, // Light Orange
      { bg: '#F2FAFE', border: '#BDE6F8' }  // Light Blue
    ];

    function getCardColors(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
         hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      const index = Math.abs(hash) % CARD_COLORS.length;
      return CARD_COLORS[index];
    }

    /* ============ Swipe Interface (Two-Step Action) ============ */
    function attachSwipeInteractions(wrapperEl, id, content) {
      const cardEl = wrapperEl.querySelector('.swipe-card');
      const bgDel = wrapperEl.querySelector('.bg-delete');
      const bgEdit = wrapperEl.querySelector('.bg-edit');
      const btnDel = wrapperEl.querySelector('.btn-delete');
      const btnEdit = wrapperEl.querySelector('.btn-edit');

      let startX = 0, currentX = 0, dragging = false;
      let decided = false, horizontal = false;
      let lockedState = null; 

      function resetSwipe() {
        lockedState = null;
        cardEl.style.transform = 'translateX(0)';
        bgDel.style.opacity = '0';
        bgEdit.style.opacity = '0';
      }

      cardEl.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (lockedState) { resetSwipe(); return; }
        startX = e.clientX;
        dragging = true;
        decided = false;
        horizontal = false;
        cardEl.style.transition = 'none';
      });

      cardEl.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;

        if (!decided) {
          if (Math.abs(dx) > 8) {
            decided = true;
            horizontal = true;
            try { cardEl.setPointerCapture(e.pointerId); } catch(err){}
          }
        }

        if (decided && horizontal) {
          e.preventDefault();
          currentX = dx;
          // Dampen pull past max bounds
          if (currentX > 90) currentX = 90 + (currentX - 90) * 0.15;
          if (currentX < -90) currentX = -90 + (currentX + 90) * 0.15;

          cardEl.style.transform = `translateX(${currentX}px)`;
          bgDel.style.opacity = currentX > 20 ? '1' : '0';
          bgEdit.style.opacity = currentX < -20 ? '1' : '0';
        }
      });

      const endDrag = (e) => {
        if (!dragging) return;
        dragging = false;
        if (decided && horizontal) {
          try { cardEl.releasePointerCapture(e.pointerId); } catch(err){}
          cardEl.style.transition = 'transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1)';
          
          if (currentX > 60) {
            lockedState = 'delete';
            cardEl.style.transform = 'translateX(80px)';
          } else if (currentX < -60) {
            lockedState = 'edit';
            cardEl.style.transform = 'translateX(-80px)';
          } else {
            resetSwipe();
          }
        }
        currentX = 0;
      };

      cardEl.addEventListener('pointerup', endDrag);
      cardEl.addEventListener('pointercancel', endDrag);

      btnDel.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteNoteById(id);
        resetSwipe();
      });

      btnEdit.addEventListener('click', (e) => {
        e.stopPropagation();
        resetSwipe();
        
        currentEditId = id;
        textarea.value = content;
        editBanner.classList.remove('hidden');
        editBanner.classList.add('flex');
        
        appHeader.classList.add('blur-backdrop');
        mainScroll.classList.add('blur-backdrop');
        
        submitIconPath.setAttribute('d', 'M5 13l4 4L19 7');
        submitIconPath.setAttribute('stroke', 'currentColor');
        submitIconPath.setAttribute('stroke-width', '3');
        submitIconPath.setAttribute('stroke-linecap', 'round');
        submitIconPath.setAttribute('stroke-linejoin', 'round');
        submitIconPath.setAttribute('fill', 'none');
        
        updateCharCounter();
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
        submitBtn.disabled = false;
        textarea.focus();
      });
    }

    /* ============ Rendering & State ============ */
    const container = document.getElementById('notes-container');
    const scrollContainer = document.getElementById('scroll-container');
    const emptyState = document.getElementById('empty-state');
    const loadingState = document.getElementById('loading-state');
    
    const scrollTopFab = document.getElementById('scroll-top-fab');
    const scrollBottomFab = document.getElementById('scroll-bottom-fab');

    let isInitialDataLoaded = false;
    let scrollTimeout;
    let noteCache = new Map();

    function updateDateHeaders() {
       let lastDateKey = null;
       const visibleItems = Array.from(document.querySelectorAll('.timeline-item:not(.hidden)'));
       
       document.querySelectorAll('.timeline-item').forEach(item => {
           if (item.classList.contains('hidden')) return;
           const dateKey = item.dataset.dateKey;
           const header = item.querySelector('.date-header');
           
           if (dateKey !== lastDateKey) {
               header.classList.remove('hidden');
               header.classList.add('flex');
               lastDateKey = dateKey;
           } else {
               header.classList.add('hidden');
               header.classList.remove('flex');
           }
       });

       visibleItems.forEach((item, index) => {
           const line = item.querySelector('.line-segment');
           if (!line) return;
           
           const nextItem = visibleItems[index + 1];
           if (!nextItem || nextItem.dataset.dateKey !== item.dataset.dateKey) {
               line.style.display = 'none';
           } else {
               line.style.display = 'block';
           }
       });
    }

    onValue(notesRef, (snap) => {
      if (!isInitialDataLoaded) {
        isInitialDataLoaded = true;
        loadingState.classList.add('opacity-0');
        setTimeout(() => { loadingState.remove(); updateEmptyState(); updateDateHeaders(); }, 300);
      }
    }, { onlyOnce: true });

    function updateEmptyState() {
      if (!isInitialDataLoaded) return;
      if (noteCache.size > 0) {
        emptyState.classList.add('opacity-0', 'pointer-events-none');
      } else {
        emptyState.classList.remove('opacity-0', 'pointer-events-none');
        document.getElementById('no-results-state').classList.add('opacity-0', 'pointer-events-none');
      }
    }

    const scrollToTop = (smooth = true) => {
      scrollContainer.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
    };

    const scrollToBottom = (smooth = true) => {
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        scrollContainer.scrollTo({ top: scrollContainer.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
      }, 100);
    };

    function isNearBottom() {
      return scrollContainer.scrollHeight - scrollContainer.scrollTop - scrollContainer.clientHeight < 150;
    }
    
    function isNearTop() {
      return scrollContainer.scrollTop < 150;
    }

    scrollContainer.addEventListener('scroll', () => {
      if (isNearTop()) { 
         scrollTopFab.classList.add('hidden'); 
         scrollTopFab.classList.remove('flex'); 
      } else { 
         scrollTopFab.classList.remove('hidden'); 
         scrollTopFab.classList.add('flex'); 
      }

      if (isNearBottom()) { 
         scrollBottomFab.classList.add('hidden'); 
         scrollBottomFab.classList.remove('flex'); 
      } else { 
         scrollBottomFab.classList.remove('hidden'); 
         scrollBottomFab.classList.add('flex'); 
      }
    });

    scrollTopFab.addEventListener('click', () => scrollToTop(true));
    scrollBottomFab.addEventListener('click', () => scrollToBottom(true));

    /* ============ Firebase Realtime Listeners ============ */
    onChildAdded(query(notesRef, orderByChild('timestamp')), (data) => {
      const note = { id: data.key, ...data.val() };
      noteCache.set(note.id, { content: note.content, timestamp: note.timestamp });

      const dateObj = note.timestamp ? new Date(note.timestamp) : new Date();
      const dayStr = dateObj.toLocaleDateString('en-GB', { weekday: 'long' });
      const fullDateStr = dateObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });
      const timeStr = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
      const dateKey = `${dateObj.getFullYear()}-${dateObj.getMonth()}-${dateObj.getDate()}`;

      const itemDiv = document.createElement('div');
      itemDiv.className = 'timeline-item relative w-full z-10 animate-grow flex flex-col group';
      itemDiv.id = `note-${note.id}`;
      itemDiv.dataset.dateKey = dateKey;
      itemDiv.dataset.content = (note.content || '').toLowerCase();
      
      const colors = getCardColors(note.id);

      itemDiv.innerHTML = `
        <div class="date-header hidden items-baseline gap-2.5 mb-5 mt-3 px-1">
          <h2 class="text-[17px] font-extrabold text-slate-800 tracking-tight">${dayStr}</h2>
          <span class="text-[12px] font-bold text-slate-400 tracking-wide uppercase">${fullDateStr}</span>
        </div>

        <div class="flex items-start relative w-full mb-5">
          
          <div class="absolute top-[26px] bottom-[-40px] left-[11px] w-[2px] bg-slate-200/80 line-segment z-0"></div>

          <div class="relative z-10 w-[24px] flex-shrink-0 flex justify-center mt-[18px]">
             <div class="w-4 h-4 rounded-full border-[3.5px] border-slate-300 bg-white ring-[4px] ring-gray-50"></div>
          </div>

          <div class="relative z-10 w-[68px] flex-shrink-0 mt-[19px] text-center pr-2">
             <span class="block leading-[14px] text-[11px] font-extrabold text-slate-400 opacity-90 tracking-wider uppercase">${timeStr}</span>
          </div>

          <div class="relative z-10 flex-1 min-w-0 overflow-hidden rounded-[16px] swipe-container" style="background-color: ${colors.bg}; border: 1px solid ${colors.border};">
             
             <div class="absolute inset-0 flex justify-between z-0">
                <div class="w-1/2 flex items-center pl-3 bg-rose-100 bg-delete transition-opacity duration-200 opacity-0">
                   <button class="btn-delete flex flex-col items-center justify-center gap-1 text-rose-600 font-extrabold w-12 h-full active:scale-95 transition-all">
                     <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                   </button>
                </div>
                <div class="w-1/2 flex items-center justify-end pr-3 bg-indigo-100 bg-edit transition-opacity duration-200 opacity-0">
                   <button class="btn-edit flex flex-col items-center justify-center gap-1 text-indigo-600 font-extrabold w-12 h-full active:scale-95 transition-all">
                     <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                   </button>
                </div>
             </div>

             <div class="swipe-card relative z-10 px-4 py-3.5 w-full h-full transform transition-transform shadow-sm shadow-slate-200/40" style="background-color: ${colors.bg}; border-radius: inherit;">
               <div class="text-left w-full">
                 <p id="text-${note.id}" class="text-[14.5px] text-slate-800 font-medium leading-[1.6] whitespace-pre-wrap break-words select-none"></p>
               </div>
             </div>
          </div>
        </div>`;

      const pTag = itemDiv.querySelector(`#text-${note.id}`);
      pTag.textContent = note.content;

      attachSwipeInteractions(itemDiv, note.id, note.content);

      const existingItems = Array.from(container.querySelectorAll('.timeline-item'));
      const timestampValue = note.timestamp || Date.now();
      itemDiv.dataset.ts = timestampValue;
      
      let inserted = false;
      for(let existing of existingItems) {
        if(parseInt(existing.dataset.ts) > timestampValue) {
          container.insertBefore(itemDiv, existing);
          inserted = true;
          break;
        }
      }
      if(!inserted) {
         container.appendChild(itemDiv);
      }

      if (searchQuery && !itemDiv.dataset.content.includes(searchQuery)) itemDiv.classList.add('hidden');
      
      updateEmptyState();
      updateDateHeaders();

      if (isNearBottom() || !isInitialDataLoaded) scrollToBottom(isInitialDataLoaded);
    });

    onChildChanged(notesRef, (data) => {
      const note = { id: data.key, ...data.val() };
      noteCache.set(note.id, { content: note.content, timestamp: note.timestamp });
      
      const itemDiv = document.getElementById(`note-${data.key}`);
      const pTag = document.getElementById(`text-${data.key}`);
      if (pTag) pTag.textContent = note.content;
      if (itemDiv) {
        itemDiv.dataset.content = (note.content || '').toLowerCase();
        const swipeWrapper = itemDiv.querySelector('.swipe-container');
        if(swipeWrapper) {
           const oldClone = swipeWrapper.cloneNode(true);
           swipeWrapper.parentNode.replaceChild(oldClone, swipeWrapper);
           attachSwipeInteractions(itemDiv, note.id, note.content);
        }
        if (searchQuery) applySearch(searchQuery);
      }
    });

    onChildRemoved(notesRef, (data) => {
      noteCache.delete(data.key);
      const itemDiv = document.getElementById(`note-${data.key}`);
      if (itemDiv) itemDiv.remove();

      if (searchQuery) applySearch(searchQuery);
      updateEmptyState();
      updateDateHeaders(); 
    });

    /* ============ PWA Service Worker Registration ============ */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((registration) => {
          console.log('PWA ServiceWorker registered with scope:', registration.scope);
        }).catch((error) => {
          console.error('ServiceWorker registration failed:', error);
        });
      });
    }
  </script>
</body>
</html>
