<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="theme-color" content="#f9fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1F21" media="(prefers-color-scheme: dark)">
  <meta charset="UTF-8">
  <!-- Viewport: removed maximum-scale/user-scalable (accessibility + iOS zoom fix) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Activity Log</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo-192.png">

  <style>
    /* 1. Core Variables */
    :root {
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-light: #94a3b8;

      --gradient-primary: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
      --gradient-glow: rgba(236, 72, 153, 0.35);

      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;

      --rose-50: #fff1f2;
      --rose-600: #e11d48;

      /* Safe area insets for notch/home-bar devices */
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    /* 2. Resets */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      height: 100%;
      /* Prevent font size inflation on orientation change */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      height: 100%;
      background-color: var(--slate-100);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    input, textarea, button, select {
      font-family: inherit;
      border: none;
      outline: none;
    }
    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 3. App Container */
    .app-container {
      width: 100%;
      max-width: 448px;
      /* Use dvh with fallback — stays stable when soft keyboard appears */
      height: 100vh;
      height: 100dvh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    @media (min-width: 640px) {
      .app-container {
        height: min(850px, 100dvh);
        border-radius: 2rem;
        box-shadow:
          0 25px 50px -12px rgba(0, 0, 0, 0.12),
          0 0 0 1px rgba(0, 0, 0, 0.05);
      }
    }

    /* 4. Header */
    .app-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px 20px;
      /* Respect top notch in standalone PWA mode */
      padding-top: max(16px, var(--safe-top));
      border-bottom: 1px solid var(--slate-100);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 20;
    }
    .header-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-date {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-light);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* 5. Timeline Layout */
    .main-scroll {
      flex: 1;
      overflow-y: auto;
      /* Momentum scrolling on iOS */
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      scroll-behavior: smooth;
    }
    .notes-container {
      padding: 28px 0 32px 0;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 10;
    }
    .timeline-line {
      display: none;
      position: absolute;
      left: 81px;
      width: 2px;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(99, 102, 241, 0.25) 5%,
        rgba(236, 72, 153, 0.25) 95%,
        transparent
      );
      top: 28px;
      bottom: 0;
      z-index: 0;
    }

    /* 6. Empty State */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 48px 32px;
      text-align: center;
      gap: 12px;
    }
    .empty-state.visible {
      display: flex;
    }
    .empty-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--slate-100);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }
    .empty-icon svg {
      width: 26px;
      height: 26px;
      color: var(--text-light);
    }
    .empty-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .empty-sub {
      font-size: 13px;
      color: var(--text-light);
      line-height: 1.5;
    }

    /* 7. Timeline Items */
    .date-header {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 10px 0 22px 0;
      position: relative;
      z-index: 10;
    }
    .date-badge {
      background: #ffffff;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      border-radius: 9999px;
      letter-spacing: 0.05em;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid var(--slate-100);
    }
    .timeline-item {
      display: flex;
      align-items: flex-start;
      width: 100%;
      position: relative;
      z-index: 10;
    }
    .time-col {
      width: 72px;
      flex-shrink: 0;
      text-align: right;
      padding-right: 16px;
      padding-top: 3px;
    }
    .time-text {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .dot-col {
      width: 20px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      padding-top: 7px;
      position: relative;
    }
    .dot-inactive {
      width: 6px;
      height: 6px;
      background: rgba(148, 163, 184, 0.5);
      border-radius: 50%;
      box-shadow: 0 0 0 4px #ffffff;
    }
    .dot-active-container {
      position: relative;
      width: 10px;
      height: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dot-ping {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--gradient-primary);
      opacity: 0.4;
      animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .dot-core {
      position: relative;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gradient-primary);
      box-shadow: 0 0 0 4px #ffffff, 0 0 10px var(--gradient-glow);
    }
    .content-col {
      flex: 1;
      padding-left: 12px;
      padding-bottom: 28px;
      position: relative;
      text-align: left;
    }
    .content-text {
      font-size: 15.5px;
      color: var(--text-main);
      font-weight: 500;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
      padding-right: 16px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s;
      text-align: left;
      /* Prevent text selection on quick tap */
      -webkit-user-select: none;
      user-select: none;
    }
    .content-text:active {
      opacity: 0.5;
      transform: scale(0.99);
    }

    /* 8. Bottom Bar */
    .bottom-bar {
      position: relative;
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      flex-shrink: 0;
      z-index: 30;
      /* Safe area padding for home bar */
      padding: 10px 12px max(10px, calc(var(--safe-bottom) + 2px)) 12px;
      border-top: 1px solid var(--slate-200);
    }

    /* Loading bar */
    .status-bar-wrapper {
      position: absolute;
      top: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: transparent;
      overflow: hidden;
    }
    .status-bar-line {
      height: 100%;
      width: 60%;
      border-radius: 4px;
      transition: background 0.3s ease, opacity 0.4s ease;
    }

    .bottom-bar.offline .status-bar-line {
      background: linear-gradient(90deg, transparent, var(--rose-600), transparent);
      width: 100%;
      opacity: 1;
    }
    .bottom-bar.connecting .status-bar-line {
      background: linear-gradient(90deg, transparent, #f59e0b, transparent);
      animation: barRun 1.4s infinite ease-in-out;
      opacity: 1;
    }
    .bottom-bar.syncing .status-bar-line {
      background: linear-gradient(90deg, transparent, #06b6d4, transparent);
      animation: barRun 1s infinite ease-in-out;
      opacity: 1;
    }
    .bottom-bar.online .status-bar-line {
      opacity: 0;
      animation: none;
    }

    @keyframes barRun {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(220%); }
    }

    /* 9. Input Area */
    .input-form {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--slate-50);
      border: 1.5px solid var(--slate-200);
      border-radius: 22px;
      transition: border-color 0.2s, box-shadow 0.2s;
      padding: 0 4px;
    }
    .input-wrapper:focus-within {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
      background: #ffffff;
    }
    .main-input {
      flex: 1;
      background: transparent;
      padding: 10px 12px;
      font-size: 15px;
      color: var(--text-main);
      font-weight: 500;
      resize: none;
      max-height: 120px;
      line-height: 1.4;
    }
    .main-input::placeholder {
      color: var(--text-light);
      font-weight: 400;
    }
    .submit-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      background: var(--gradient-primary);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 12px var(--gradient-glow);
    }
    .submit-btn:hover {
      transform: scale(1.06) translateY(-1px);
      box-shadow: 0 6px 18px var(--gradient-glow);
    }
    .submit-btn:active {
      transform: scale(0.93);
      box-shadow: 0 2px 8px var(--gradient-glow);
    }
    .submit-btn:disabled {
      opacity: 0.45;
      transform: none;
      cursor: not-allowed;
    }
    .icon-send {
      width: 18px;
      height: 18px;
      position: relative;
      left: 1px;
    }

    /* 10. Modals */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
    }
    .modal-backdrop.flex {
      display: flex;
      animation: fadeIn 0.25s ease forwards;
    }
    /* Dim overlay */
    .modal-backdrop::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.25);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    .modal-surface {
      position: relative;
      background: rgba(255, 255, 255, 0.99);
      width: 100%;
      padding: 24px 24px 20px 24px;
      /* Safe area bottom padding */
      padding-bottom: max(24px, calc(var(--safe-bottom) + 12px));
      border-radius: 28px 28px 0 0;
      box-shadow: 0 -20px 60px -12px rgba(0,0,0,0.18);
      transform: translateY(100%);
      animation: slideUp 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      border-top: 1px solid var(--slate-100);
    }
    .modal-drag-handle {
      width: 36px;
      height: 4px;
      background: var(--slate-200);
      border-radius: 9999px;
      margin: 0 auto 20px auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.025em;
    }
    .btn-close-icon {
      background: var(--slate-100);
      color: var(--text-muted);
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-close-icon:hover {
      background: var(--slate-200);
      color: var(--text-main);
    }
    .btn-close-icon svg { width: 20px; height: 20px; }

    .edit-textarea {
      display: block;
      width: 100%;
      padding: 14px 16px;
      font-size: 15.5px;
      color: var(--text-main);
      font-weight: 500;
      background: var(--slate-50);
      border-radius: 18px;
      border: 1.5px solid var(--slate-200);
      margin-bottom: 16px;
      resize: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      line-height: 1.55;
    }
    .edit-textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
      background: white;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 14px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      letter-spacing: -0.01em;
    }
    .btn:active { transform: scale(0.97); }
    .btn-icon {
      flex: none;
      width: 52px;
    }
    .btn-delete {
      background: var(--rose-50);
      color: var(--rose-600);
      border: 1.5px solid rgba(225, 29, 72, 0.12);
    }
    .btn-delete:hover { background: #ffe4e6; }
    .btn-primary {
      background: var(--gradient-primary);
      color: white;
      box-shadow: 0 4px 12px var(--gradient-glow);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 18px var(--gradient-glow);
    }

    /* 11. Animations */
    @keyframes ping {
      75%, 100% { transform: scale(2.5); opacity: 0; }
    }
    @keyframes smoothGrow {
      0%   { opacity: 0; transform: translateY(12px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-grow {
      opacity: 0;
      animation: smoothGrow 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    @keyframes fadeIn {
      0%   { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes slideUp {
      0%   { transform: translateY(100%); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- Header -->
    <header class="app-header">
      <span class="header-title">Activity Log</span>
      <span class="header-date" id="header-date"></span>
    </header>

    <!-- Timeline -->
    <main class="main-scroll no-scrollbar" id="scroll-container">
      <div class="notes-container" id="notes-container">
        <div class="timeline-line"></div>

        <!-- Empty state (shown until first entry loads) -->
        <div class="empty-state visible" id="empty-state">
          <div class="empty-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
          </div>
          <p class="empty-title">No entries yet</p>
          <p class="empty-sub">Log your first activity below<br>and it'll appear here.</p>
        </div>
      </div>
    </main>

    <!-- Bottom Input Bar -->
    <footer id="bottom-bar" class="bottom-bar connecting">
      <div class="status-bar-wrapper">
        <div class="status-bar-line"></div>
      </div>

      <form id="add-form" class="input-form">
        <div class="input-wrapper">
          <textarea id="add-content" required rows="1"
            class="main-input no-scrollbar"
            placeholder="Log activity…"
            autocomplete="off"
            autocorrect="on"
            spellcheck="true"
          ></textarea>
        </div>
        <button type="submit" class="submit-btn" id="submit-btn" disabled>
          <svg class="icon-send" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
              d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
        </button>
      </form>
    </footer>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Edit log entry">
      <div class="modal-surface">
        <div class="modal-drag-handle"></div>

        <div class="modal-header">
          <h3 class="modal-title">Edit Entry</h3>
          <button type="button" class="close-modal-btn btn-close-icon" aria-label="Close">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <form id="edit-form">
          <input type="hidden" id="edit-id">
          <textarea id="edit-content" required rows="4" class="edit-textarea no-scrollbar"></textarea>

          <div class="modal-actions">
            <button type="button" id="delete-btn" class="btn btn-icon btn-delete" aria-label="Delete entry">
              <svg style="width:20px;height:20px" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
            <button type="submit" class="btn btn-primary">Update</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script>
    // Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(r => console.log('SW registered:', r.scope))
          .catch(e => console.warn('SW registration failed:', e));
      });
    }

    // Header date
    (function () {
      const el = document.getElementById('header-date');
      const d = new Date();
      el.textContent = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();
    })();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import {
      getDatabase, ref, onValue, push, set, update, remove,
      serverTimestamp, onChildAdded, onChildChanged, onChildRemoved,
      query, orderByChild
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBmXewXcQQt97EJzbKceLbCoTTG_9aJlJI",
      authDomain: "bhaskarjyoticlub.firebaseapp.com",
      databaseURL: "https://bhaskarjyoticlub-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "bhaskarjyoticlub",
      storageBucket: "bhaskarjyoticlub.firebasestorage.app",
      messagingSenderId: "730168687443",
      appId: "1:730168687443:web:479bedc258bd9dd06fffa6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const notesRef = ref(db, 'notes');

    /* --- Network & Status State --- */
    const bottomBar = document.getElementById('bottom-bar');
    let connectionState = 'connecting';
    let activityState = 'idle';
    let activeUploads = 0;

    function updateStatusUI() {
      if (connectionState === 'offline') {
        bottomBar.className = 'bottom-bar offline';
      } else if (connectionState === 'connecting') {
        bottomBar.className = 'bottom-bar connecting';
      } else {
        bottomBar.className = (activeUploads > 0 || activityState === 'syncing')
          ? 'bottom-bar syncing'
          : 'bottom-bar online';
      }
    }

    // Firebase connectivity
    onValue(ref(db, '.info/connected'), (snap) => {
      connectionState = snap.val() ? 'online' : 'connecting';
      updateStatusUI();
    });

    // Browser online/offline events (covers network cable pull, airplane mode)
    window.addEventListener('online',  () => { connectionState = 'connecting'; updateStatusUI(); });
    window.addEventListener('offline', () => { connectionState = 'offline';    updateStatusUI(); });

    // Upload tracking
    function runSyncTask(promise) {
      activeUploads++;
      updateStatusUI();
      return promise.finally(() => {
        activeUploads--;
        updateStatusUI();
      });
    }

    // Download tracking (debounced)
    let delayResetTimer;
    let delayIndex = 0;

    function triggerDownloadUI() {
      if (activeUploads > 0) return;
      activityState = 'syncing';
      updateStatusUI();
      clearTimeout(delayResetTimer);
      delayResetTimer = setTimeout(() => {
        delayIndex = 0;
        if (activeUploads === 0) {
          activityState = 'idle';
          updateStatusUI();
        }
      }, 500);
    }

    /* --- Input: auto-grow + submit button state --- */
    const textarea = document.getElementById('add-content');
    const submitBtn = document.getElementById('submit-btn');

    textarea.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
      submitBtn.disabled = !this.value.trim();
    });

    // Allow Shift+Enter for newline, Enter alone submits
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!textarea.value.trim()) return;
        document.getElementById('add-form').requestSubmit();
      }
    });

    /* --- Forms --- */
    document.getElementById('add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!textarea.value.trim()) return;
      runSyncTask(set(push(notesRef), {
        content: textarea.value.trim(),
        timestamp: serverTimestamp()
      }));
      textarea.value = '';
      textarea.style.height = 'auto';
      submitBtn.disabled = true;
    });

    document.getElementById('edit-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const content = document.getElementById('edit-content').value.trim();
      if (!content) return;
      runSyncTask(update(ref(db, `notes/${document.getElementById('edit-id').value}`), { content }));
      closeModals();
    });

    document.getElementById('delete-btn').addEventListener('click', () => {
      if (confirm('Permanently delete this entry?')) {
        runSyncTask(remove(ref(db, `notes/${document.getElementById('edit-id').value}`)));
        closeModals();
      }
    });

    /* --- Modals --- */
    const openModal  = (id) => document.getElementById(id).classList.add('flex');
    const closeModals = () => document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('flex'));

    document.querySelectorAll('.close-modal-btn').forEach(btn => btn.addEventListener('click', closeModals));

    // Close on backdrop tap (outside modal surface)
    document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) closeModals();
      });
    });

    // Close modals on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModals();
    });

    const openEdit = (id, content) => {
      document.getElementById('edit-id').value = id;
      document.getElementById('edit-content').value = content;
      openModal('edit-modal');
    };

    /* --- Empty state --- */
    const emptyState = document.getElementById('empty-state');
    function updateEmptyState() {
      const hasItems = container.querySelectorAll('.timeline-item').length > 0;
      emptyState.classList.toggle('visible', !hasItems);
    }

    /* --- DOM Updates --- */
    const container = document.getElementById('notes-container');
    const scrollContainer = document.getElementById('scroll-container');
    let lastDateStr = null;
    let scrollTimeout;

    const scrollToBottom = () => {
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        scrollContainer.scrollTo({ top: scrollContainer.scrollHeight, behavior: 'smooth' });
      }, 100);
    };

    onChildAdded(query(notesRef, orderByChild('timestamp')), (data) => {
      triggerDownloadUI();

      const tLine = document.querySelector('.timeline-line');
      if (tLine) tLine.style.display = 'block';

      const note = { id: data.key, ...data.val() };
      const dateObj = note.timestamp ? new Date(note.timestamp) : new Date();
      const dateStr = dateObj.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const timeStr = dateObj.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase();

      const currentDelay = delayIndex * 0.07;
      delayIndex++;

      const oldActive = document.querySelector('.dot-active-container');
      if (oldActive) oldActive.outerHTML = '<div class="dot-inactive"></div>';

      if (dateStr !== lastDateStr) {
        lastDateStr = dateStr;
        const headerDiv = document.createElement('div');
        headerDiv.className = 'date-header animate-grow';
        headerDiv.style.animationDelay = `${currentDelay}s`;
        headerDiv.innerHTML = `<span class="date-badge">${dateStr}</span>`;
        container.appendChild(headerDiv);
      }

      const itemDiv = document.createElement('div');
      itemDiv.className = 'timeline-item animate-grow';
      itemDiv.style.animationDelay = `${currentDelay}s`;
      itemDiv.id = `note-${note.id}`;
      itemDiv.innerHTML = `
        <div class="time-col"><span class="time-text">${timeStr}</span></div>
        <div class="dot-col">
          <div class="dot-active-container">
            <span class="dot-ping"></span><span class="dot-core"></span>
          </div>
        </div>
        <div class="content-col">
          <p id="text-${note.id}" class="content-text"></p>
        </div>`;

      const pTag = itemDiv.querySelector('.content-text');
      pTag.textContent = note.content;
      pTag.addEventListener('click', () => openEdit(note.id, note.content));

      container.appendChild(itemDiv);
      updateEmptyState();
      scrollToBottom();
    });

    onChildChanged(notesRef, (data) => {
      triggerDownloadUI();
      const pTag = document.getElementById(`text-${data.key}`);
      if (pTag) {
        const newContent = data.val().content;
        pTag.textContent = newContent;
        const clone = pTag.cloneNode(true);
        clone.addEventListener('click', () => openEdit(data.key, newContent));
        pTag.replaceWith(clone);
      }
    });

    onChildRemoved(notesRef, (data) => {
      triggerDownloadUI();
      const itemDiv = document.getElementById(`note-${data.key}`);
      if (itemDiv) itemDiv.remove();

      if (container.querySelectorAll('.timeline-item').length === 0) {
        const tLine = document.querySelector('.timeline-line');
        if (tLine) tLine.style.display = 'none';
        lastDateStr = null;
      }
      updateEmptyState();
    });
  </script>
</body>
</html>
