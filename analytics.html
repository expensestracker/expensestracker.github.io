<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - Money Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Custom utility for the exact card shadows seen in the screenshot */
    .shadow-soft {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    .shadow-purple {
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
    }
  </style>
</head>
<body class="bg-[#f8f9fa] text-gray-800 font-sans min-h-screen pb-10">

  <header class="bg-white shadow-sm sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-2 flex justify-between items-center">
      <div class="flex items-center space-x-3">

        <div class="flex items-center space-x-2">
          <img src="logo-192.webp" class="h-10">

          <div>
            <h1 class="text-m font-black leading-tight">Money Tracker</h1>
            <p class="text-s text-gray-600">
              Analytics
            </p>
          </div>
        </div>
      </div>

      <div id="loading-indicator" class="">
        <div class="flex items-center justify-center space-x-2">

          <div class="w-2.5 h-2.5 bg-blue-500 rounded-full animate-[dot_1.4s_infinite]"></div>

          <div class="w-2.5 h-2.5 bg-blue-500 rounded-full animate-[dot_1.4s_0.2s_infinite]"></div>

          <div class="w-2.5 h-2.5 bg-blue-500 rounded-full animate-[dot_1.4s_0.4s_infinite]"></div>

        </div>

        <style>
          @keyframes dot {
            0%, 80%, 100% {
              transform: scale(0);
              opacity: 0.4;
            }
            40% {
              transform: scale(1);
              opacity: 1;
            }
          }
        </style>
      </div>
      <a href="index.html" class="text-m p-1 text-gray-400 hover:text-indigo-600 transition bg-gray-50 rounded-full">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
      </a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-6 hidden" id="analytics-content">

    <div class="bg-indigo-600 text-white p-6 rounded-[2rem] shadow-purple relative overflow-hidden mb-6">
      <div class="absolute -right-12 -top-12 w-48 h-48 bg-white opacity-10 rounded-full pointer-events-none"></div>

      <div class="relative z-10">
        <h2 id="project-name-display" class="text-lg font-medium text-white">Loading...</h2>
        <p id="total-spent" class="text-5xl font-bold tracking-tight mb-6">
          ₹0
        </p>

        <div class="h-px bg-indigo-500 w-full mb-4 opacity-60"></div>

        <div class="flex justify-between items-center">
          <div>
            <h3 class="text-indigo-200 text-xs font-medium mb-1 uppercase tracking-wider">Spent This Month</h3>
            <p id="month-total" class="text-2xl font-bold text-white">
              ₹0
            </p>
          </div>
          <div class="text-right">
            <h3 class="text-indigo-200 text-xs font-medium mb-1 uppercase tracking-wider">Avg. Daily</h3>
            <p id="daily-avg" class="text-2xl font-bold text-white">
              ₹0
            </p>
          </div>
        </div>
      </div>
    </div>

    <div class="space-y-6">

      <div class="bg-white p-6 rounded-[2rem] shadow-soft">
        <div class="flex items-center mb-4">
          <div class="w-1.5 h-5 bg-indigo-500 rounded-full mr-3"></div>
          <h3 class="text-base font-semibold text-gray-800">Daily Trend</h3>
        </div>
        <div class="relative h-64 w-full">
          <canvas id="daily-chart"></canvas>
        </div>
      </div>

      <div class="bg-white p-6 rounded-[2rem] shadow-soft">
        <div class="flex items-center mb-4">
          <div class="w-1.5 h-5 bg-indigo-500 rounded-full mr-3"></div>
          <h3 class="text-base font-semibold text-gray-800">Item wise summary</h3>
        </div>
        <div class="relative h-64 w-full md:w-2/3 mx-auto">
          <canvas id="category-chart"></canvas>
        </div>
      </div>

      <div class="bg-white p-6 rounded-[2rem] shadow-soft">
        <div class="flex items-center mb-4">
          <div class="w-1.5 h-5 bg-indigo-500 rounded-full mr-3"></div>
          <h3 class="text-base font-semibold text-gray-800">Monthly Spending</h3>
        </div>
        <div class="relative h-64 w-full">
          <canvas id="monthly-chart"></canvas>
        </div>
      </div>

    </div>

  </main>

  <script type="module" src="analytics.js"></script>
</body>
</html>
