<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Light mode -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <!-- Dark mode -->
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTrack</title>
  <meta name="description" content="Track expenses easily">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <!-- Fonts -->
  <link rel="preload" href="sans-display.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Custom utility for the exact card shadows seen in the screenshot */
    .shadow-soft {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    .shadow-purple {
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
    }
  </style>
  <style>
    @font-face {
      font-family: 'Google Sans Text';
      src: url('./GoogleSansText-Regular.woff2') format('woff2');
      font-weight: 400; [cite_start]/* [cite: 72-78] */
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Google Sans Text';
      src: url('./GoogleSansText-Bold.woff2') format('woff2');
      font-weight: 700; [cite_start]/* [cite: 1-71] */
      font-style: normal;
      font-display: swap;
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Google Sans Text"', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>

  <header id="app-header" class="sticky top-0 bg-white/80 backdrop-blur-md border-b border-slate-200 z-20 px-4 py-2 flex justify-between items-center">
    <div class="flex items-center gap-3">

      <!-- Logo -->
      <img src="logo-192.webp" class="h-10">

      <!-- App Name + Status -->
      <div class="flex flex-col leading-tight">
        <span class="text-m font-black">FinTrack</span>

        <!-- Online / Offline Status -->
        <div class="flex items-center gap-1 text-sm text-gray-500 font-medium">
          Analytics
        </div>
      </div>

    </div>
    <!-- From Uiverse.io by dovatgabriel -->
    <div id="loading-indicator" class="three-body p-4">
      <div class="three-body__dot"></div>
      <div class="three-body__dot"></div>
      <div class="three-body__dot"></div>
    </div>

    <a id="back-btn" href="index.html" class="text-m p-1 text-gray-400 hover:text-indigo-600 transition bg-gray-50 rounded-full hidden">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
    </a>

  </header>
  <main id="skeleton-loader" class="max-w-6xl mx-auto px-4 mt-6">
    <div class="bg-indigo-600/50 p-6 rounded-3xl shadow-purple relative overflow-hidden mb-6 animate-pulse">
      <div class="relative z-10">
        <div class="h-5 bg-indigo-300/50 rounded-full w-32 mb-4"></div>
        <div class="h-12 bg-indigo-200/50 rounded-lg w-48 mb-6"></div>

        <div class="flex justify-between items-center">
          <div>
            <div class="h-3 bg-indigo-300/50 rounded-full w-24 mb-2"></div>
            <div class="h-8 bg-indigo-200/50 rounded-lg w-24"></div>
          </div>
          <div class="text-right flex flex-col items-end">
            <div class="h-3 bg-indigo-300/50 rounded-full w-20 mb-2"></div>
            <div class="h-8 bg-indigo-200/50 rounded-lg w-20"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="space-y-6">
      <div class="bg-white p-6 rounded-3xl shadow-soft animate-pulse">
        <div class="flex items-center mb-4">
          <div class="w-1.5 h-5 bg-gray-200 rounded-full mr-3"></div>
          <div class="h-5 bg-gray-200 rounded-full w-28"></div>
        </div>
        <div class="h-64 bg-gray-100 rounded-xl w-full"></div>
      </div>

      <div class="bg-white p-6 rounded-3xl shadow-soft animate-pulse">
        <div class="flex items-center mb-4">
          <div class="w-1.5 h-5 bg-gray-200 rounded-full mr-3"></div>
          <div class="h-5 bg-gray-200 rounded-full w-40"></div>
        </div>
        <div class="h-64 bg-gray-100 rounded-xl w-full md:w-2/3 mx-auto"></div>
      </div>

      <div class="bg-white p-6 rounded-3xl shadow-soft animate-pulse">
        <div class="flex items-center mb-4">
          <div class="w-1.5 h-5 bg-gray-200 rounded-full mr-3"></div>
          <div class="h-5 bg-gray-200 rounded-full w-36"></div>
        </div>
        <div class="h-64 bg-gray-100 rounded-xl w-full"></div>
      </div>
    </div>
  </main>

  <main class="max-w-6xl mx-auto px-4 mt-6 hidden" id="analytics-content">

    <div class="bg-indigo-600 text-white p-6 rounded-3xl shadow-purple relative overflow-hidden mb-6">
      <div class="absolute -right-12 -top-12 w-48 h-48 bg-white opacity-10 rounded-full pointer-events-none"></div>

      <div class="relative z-10">
        <h2 id="project-name-display" class="text-lg font-medium text-white">Loading...</h2>
        <p id="total-spent" class="text-5xl font-bold tracking-tight mb-6">
          ₹0
        </p>

        <div class="flex justify-between items-center">
          <div>
            <h3 class="text-indigo-200 text-xs font-medium mb-1 uppercase tracking-wider">Spent This Month</h3>
            <p id="month-total" class="text-2xl font-bold text-white">
              ₹0
            </p>
          </div>
          <div class="text-right">
            <h3 class="text-indigo-200 text-xs font-medium mb-1 uppercase tracking-wider">Avg. Daily</h3>
            <p id="daily-avg" class="text-2xl font-bold text-white">
              ₹0
            </p>
          </div>
        </div>
      </div>
    </div>

    <div class="space-y-6">

      <div class="bg-white p-6 rounded-3xl shadow-soft">
        <div class="flex items-center mb-4">
          <div class="w-1.5 h-5 bg-indigo-500 rounded-full mr-3"></div>
          <h3 class="text-base font-semibold text-gray-800">Daily Trend</h3>
        </div>
        <div class="relative h-64 w-full">
          <canvas id="daily-chart"></canvas>
        </div>
      </div>

      <div class="bg-white p-6 rounded-3xl shadow-soft">
        <div class="flex items-center mb-4">
          <div class="w-1.5 h-5 bg-indigo-500 rounded-full mr-3"></div>
          <h3 class="text-base font-semibold text-gray-800">Item wise summary</h3>
        </div>
        <div class="relative h-64 w-full md:w-2/3 mx-auto">
          <canvas id="category-chart"></canvas>
        </div>
      </div>

      <div class="bg-white p-6 rounded-3xl shadow-soft">
        <div class="flex items-center mb-4">
          <div class="w-1.5 h-5 bg-indigo-500 rounded-full mr-3"></div>
          <h3 class="text-base font-semibold text-gray-800">Monthly Spending</h3>
        </div>
        <div class="relative h-64 w-full">
          <canvas id="monthly-chart"></canvas>
        </div>
      </div>

    </div>

  </main>

  <script type="module" src="analytics.js"></script>
</body>
</html>
