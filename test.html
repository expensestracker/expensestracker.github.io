<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Construction Expense Tracker</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Export -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.29"></script>

<style>
.tab-btn { padding:8px 16px;border-radius:6px;background:#e5e7eb }
.tab-btn.active { background:#4f46e5;color:#fff }
</style>
</head>

<body class="bg-gray-100 p-6">

<h1 class="text-2xl font-bold mb-4">Construction Expense Tracker</h1>

<!-- Tabs -->
<div class="flex gap-2 mb-4">
  <button id="tab-expenses" class="tab-btn active">Expenses</button>
  <button id="tab-analytics" class="tab-btn">Analytics</button>
</div>

<!-- EXPENSE TAB -->
<div id="expenses-view">

  <input id="search-box" type="search"
    placeholder="Search material..."
    class="border p-2 mb-3 w-full"/>

  <table class="w-full bg-white rounded shadow">
    <thead class="bg-gray-200">
      <tr>
        <th class="p-2 text-left">Material</th>
        <th class="p-2 text-left">Cost</th>
        <th class="p-2 text-left">Date</th>
      </tr>
    </thead>
    <tbody id="expense-list"></tbody>
  </table>

  <div class="flex justify-between mt-4">
    <button id="prev-btn" class="px-4 py-2 bg-gray-300 rounded">Prev</button>
    <button id="next-btn" class="px-4 py-2 bg-gray-300 rounded">Next</button>
  </div>

  <div class="flex gap-3 mt-4">
    <button id="export-pdf" class="px-4 py-2 bg-red-500 text-white rounded">
      Export PDF
    </button>
    <button id="export-excel" class="px-4 py-2 bg-green-600 text-white rounded">
      Export Excel
    </button>
  </div>
</div>

<!-- ANALYTICS TAB -->
<div id="analytics-view" class="hidden">
  <canvas id="materialPie" height="120"></canvas>
</div>

<!-- FIREBASE + LOGIC -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import {
  getFirestore, collection, query, where,
  orderBy, limit, startAfter, getDocs
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import {
  getAuth, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAEZsRWj_7ZAVfwW8PR7Nj4c2rR3gbeGw0",
  authDomain: "construction-expenses-app.firebaseapp.com",
  projectId: "construction-expenses-app"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* GLOBAL STATE */
let currentUser;
let activeProjectId = "General";
let lastDoc = null;
let pageSize = 8;
let allExpenses = [];
let pieChart;

/* AUTH */
onAuthStateChanged(auth, user => {
  if (user) {
    currentUser = user;
    loadExpenses();
  }
});

/* LOAD EXPENSES (PAGINATION) */
async function loadExpenses(next=true) {
  const ref = collection(
    db,
    `artifacts/construction-expenses/users/${currentUser.uid}/expenses`
  );

  let q = query(
    ref,
    where("projectId","==",activeProjectId),
    orderBy("date","desc"),
    limit(pageSize)
  );

  if (next && lastDoc) q = query(q, startAfter(lastDoc));

  const snap = await getDocs(q);
  if (!snap.empty) lastDoc = snap.docs[snap.docs.length-1];

  allExpenses = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  renderTable(allExpenses);
  renderPie(allExpenses);
}

/* TABLE */
function renderTable(data){
  const tbody = document.getElementById("expense-list");
  tbody.innerHTML = data.map(e => `
    <tr class="border-b">
      <td class="p-2">${e.material}</td>
      <td class="p-2">₹${e.cost}</td>
      <td class="p-2">${e.date}</td>
    </tr>
  `).join("");
}

/* SEARCH */
document.getElementById("search-box").addEventListener("input", e=>{
  const q = e.target.value.toLowerCase();
  renderTable(
    allExpenses.filter(x =>
      x.material.toLowerCase().includes(q))
  );
});

/* PAGINATION */
document.getElementById("next-btn").onclick = ()=>loadExpenses(true);
document.getElementById("prev-btn").onclick = ()=>{
  lastDoc=null;
  loadExpenses();
};

/* PIE CHART */
function renderPie(expenses){
  const map={};
  expenses.forEach(e=>{
    map[e.material]=(map[e.material]||0)+e.cost;
  });

  if(pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById("materialPie"),{
    type:"pie",
    data:{
      labels:Object.keys(map),
      datasets:[{ data:Object.values(map) }]
    }
  });
}

/* EXPORT EXCEL */
document.getElementById("export-excel").onclick=()=>{
  const ws=XLSX.utils.json_to_sheet(allExpenses);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Expenses");
  XLSX.writeFile(wb,"expenses.xlsx");
};

/* EXPORT PDF */
document.getElementById("export-pdf").onclick=()=>{
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF();
  doc.text("Expense Report",14,15);
  doc.autoTable({
    startY:20,
    head:[["Material","Cost","Date"]],
    body:allExpenses.map(e=>[e.material,e.cost,e.date])
  });
  doc.save("expenses.pdf");
};

/* TAB SWITCH */
const expTab=document.getElementById("tab-expenses");
const anaTab=document.getElementById("tab-analytics");

expTab.onclick=()=>{
  expTab.classList.add("active");
  anaTab.classList.remove("active");
  document.getElementById("expenses-view").classList.remove("hidden");
  document.getElementById("analytics-view").classList.add("hidden");
};

anaTab.onclick=()=>{
  anaTab.classList.add("active");
  expTab.classList.remove("active");
  document.getElementById("analytics-view").classList.remove("hidden");
  document.getElementById("expenses-view").classList.add("hidden");
};
</script>

</body>
</html>
