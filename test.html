<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Expense Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        .tab-btn.active { border-bottom: 3px solid #6366f1; color: #6366f1; }
        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 font-sans">

    <nav class="bg-white shadow-sm sticky top-0 z-10">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <span class="text-xl font-bold text-indigo-600">ExpenseTracker Pro</span>
                <div class="flex space-x-8">
                    <button onclick="switchTab('dashboard')" id="tab-dashboard" class="tab-btn active py-5 px-1 text-sm font-medium transition-all">Dashboard</button>
                    <button onclick="switchTab('expenses')" id="tab-expenses" class="tab-btn py-5 px-1 text-sm font-medium transition-all">All Expenses</button>
                </div>
                <button id="logout-btn" class="text-sm text-red-500 hover:text-red-700">Sign Out</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 lg:p-8">
        
        <div id="section-dashboard" class="view-section active space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                    <h3 class="text-slate-500 text-sm font-medium uppercase">Total Spend</h3>
                    <p id="total-spend-display" class="text-3xl font-bold text-slate-800 mt-2">₹0.00</p>
                </div>
                
                <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                    <h3 class="text-slate-500 text-sm font-medium mb-4">Material Distribution</h3>
                    <div class="h-64 flex justify-center">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="bg-indigo-600 p-6 rounded-xl shadow-lg text-white">
                <h3 class="text-lg font-semibold mb-4">Quick Add Expense</h3>
                <form id="quick-add-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input type="text" id="q-material" placeholder="Material Name" class="rounded-lg p-2 text-slate-800 outline-none" required>
                    <input type="number" id="q-cost" placeholder="Cost (₹)" class="rounded-lg p-2 text-slate-800 outline-none" required>
                    <input type="date" id="q-date" class="rounded-lg p-2 text-slate-800 outline-none" required>
                    <button type="submit" class="bg-white text-indigo-600 font-bold rounded-lg hover:bg-slate-100 transition-colors">Add</button>
                </form>
            </div>
        </div>

        <div id="section-expenses" class="view-section space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-lg shadow-sm">
                <div class="relative w-full md:w-96">
                    <input type="text" id="search-bar" placeholder="Search materials..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    <svg class="w-5 h-5 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <div class="flex gap-2">
                    <button onclick="exportToPDF()" class="bg-slate-800 text-white px-4 py-2 rounded-lg flex items-center text-sm">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        PDF Export
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase">Date</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase">Material</th>
                            <th class="px-6 py-3 text-right text-xs font-semibold text-slate-500 uppercase">Amount</th>
                        </tr>
                    </thead>
                    <tbody id="paginated-list" class="divide-y divide-slate-100">
                        </tbody>
                </table>
                <div class="p-4 flex justify-between items-center bg-slate-50">
                    <button id="prev-page" class="text-sm font-medium text-indigo-600 disabled:text-slate-300">Previous</button>
                    <span id="page-info" class="text-xs text-slate-500">Page 1</span>
                    <button id="next-page" class="text-sm font-medium text-indigo-600 disabled:text-slate-300">Next</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, startAfter, getDocs, where, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIG (Placeholder - same as your provided file)
        const firebaseConfig = { /* ... your config ... */ };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // State
        let lastVisible = null;
        let firstVisible = null;
        let currentPage = 1;
        const PAGE_SIZE = 10;
        let chartInstance = null;
        let allExpenses = []; // Local cache for filtering and chart

        // --- Tab Switching ---
        window.switchTab = (tab) => {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`section-${tab}`).classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
            if(tab === 'dashboard') updateChart();
        };

        // --- Efficient Pagination & Data ---
        async function fetchExpenses(direction = 'next') {
            const expensesRef = collection(db, "artifacts/construction-expenses/users/YOUR_USER_ID/expenses");
            let q;

            if (direction === 'next' && lastVisible) {
                q = query(expensesRef, orderBy("date", "desc"), startAfter(lastVisible), limit(PAGE_SIZE));
            } else {
                q = query(expensesRef, orderBy("date", "desc"), limit(PAGE_SIZE));
            }

            const snapshot = await getDocs(q);
            if (!snapshot.empty) {
                lastVisible = snapshot.docs[snapshot.docs.length - 1];
                renderTable(snapshot.docs.map(d => d.data()));
                updatePageUI();
            }
        }

        // --- Real-time Summary & Chart ---
        function setupLiveUpdates() {
            const expensesRef = collection(db, "artifacts/construction-expenses/users/YOUR_USER_ID/expenses");
            onSnapshot(expensesRef, (snapshot) => {
                allExpenses = snapshot.docs.map(doc => doc.data());
                updateTotalSpend();
                if(document.getElementById('section-dashboard').classList.contains('active')) {
                    updateChart();
                }
            });
        }

        function updateChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const dataMap = allExpenses.reduce((acc, curr) => {
                acc[curr.material] = (acc[curr.material] || 0) + curr.cost;
                return acc;
            }, {});

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(dataMap),
                    datasets: [{
                        data: Object.values(dataMap),
                        backgroundColor: ['#6366f1', '#f43f5e', '#10b981', '#f59e0b', '#8b5cf6', '#64748b']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // --- PDF Export ---
        window.exportToPDF = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(18);
            doc.text("Project Expense Report", 14, 22);
            doc.setFontSize(11);
            doc.setTextColor(100);
            doc.text(`Generated on: ${new Date().toLocaleDateString()}`, 14, 30);

            const tableData = allExpenses.map(exp => [
                exp.date,
                exp.material,
                `Rs. ${exp.cost.toLocaleString()}`
            ]);

            doc.autoTable({
                startY: 40,
                head: [['Date', 'Material', 'Amount']],
                body: tableData,
                theme: 'striped',
                headStyles: { fillColor: [99, 102, 241] }
            });

            doc.save("expenses_report.pdf");
        };

        // Initialize
        setupLiveUpdates();
        fetchExpenses();
        
        // Logic for search, rendering, and total spend...
        function renderTable(data) {
            const list = document.getElementById('paginated-list');
            list.innerHTML = data.map(exp => `
                <tr>
                    <td class="px-6 py-4 text-sm text-slate-600">${exp.date}</td>
                    <td class="px-6 py-4 text-sm font-medium text-slate-800">${exp.material}</td>
                    <td class="px-6 py-4 text-sm text-right font-bold">₹${exp.cost.toLocaleString()}</td>
                </tr>
            `).join('');
        }

        function updateTotalSpend() {
            const total = allExpenses.reduce((s, e) => s + e.cost, 0);
            document.getElementById('total-spend-display').textContent = `₹${total.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
        }
    </script>
</body>
</html>
