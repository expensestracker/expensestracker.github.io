<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#f9fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1F21" media="(prefers-color-scheme: dark)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <title>Reset Password - HisapBook</title>
  <meta name="description" content="Reset your HisapBook password">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    html, body {
      height: 100%;
      min-height: 100vh;
      overflow: hidden;
      overscroll-behavior: none;
      width: 100%;
      margin: 0;
      padding: 0;
      touch-action: pan-x pan-y;
    }
    @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.3s ease forwards; }
  </style>
  <script>
    // Execute immediately before the page renders
    // If the URL does not contain a Supabase secure token, redirect back to login
    if (!window.location.href.includes('access_token=')) {
      window.location.replace('index.html');
    }
  </script>
</head>

<body class="bg-slate-200/50 flex items-center justify-center h-full text-slate-800 font-sans overflow-hidden overscroll-none w-full">

  <div class="w-full max-w-md h-full sm:h-[850px] bg-slate-50 sm:rounded-3xl sm:shadow-2xl relative overflow-clip flex flex-col overscroll-none">
    
    <div id="reset-view" class="view absolute inset-0 z-[80] flex flex-col bg-[radial-gradient(ellipse_at_top_left,_var(--tw-gradient-stops))] from-indigo-100 to-slate-50 overflow-y-auto no-scrollbar animate-fade-in">
        <div class="px-8 pt-14 pb-14 flex-shrink-0">
          <h1 class="text-4xl font-extrabold text-[#1e293b] tracking-tight leading-tight mb-2">Secure Account</h1>
          <p class="text-md text-slate-500 font-medium">Create a new, strong password to regain access to your dashboard.</p>
        </div>
        
        <div class="w-full bg-white rounded-t-[2.5rem] shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.08)] border-t border-sky-300 flex-1 p-8 flex flex-col">
          <div class="mb-6">
            <h2 class="text-2xl font-bold text-slate-800">Reset Password</h2>
            <p class="text-sm text-slate-500 mt-1">Enter your new credentials below</p>
          </div>
          
          <form id="reset-form" class="space-y-4">
            <!-- New Password -->
            <div class="relative w-full group">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-blue-600 z-20">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
              </div>
              <input type="password" id="new-password" required minlength="6" class="block w-full pl-11 pr-12 py-3.5 text-md text-gray-900 font-bold bg-white rounded-xl border border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-indigo-600 peer" placeholder=" ">
              <label for="new-password" class="absolute text-sm rounded-xl text-gray-500 duration-300 transform -translate-y-[18px] scale-75 top-2 z-10 origin-[0] bg-white px-2 mx-2 start-10 peer-focus:text-indigo-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-65 peer-focus:-translate-y-[18px] cursor-text">New Password</label>
              <button type="button" id="toggle-new-password-btn" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-indigo-600 focus:outline-none z-20">
                <svg id="eye-icon-1" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                <svg id="eye-slash-icon-1" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
              </button>
            </div>

            <!-- Confirm Password -->
            <div class="relative w-full group">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-blue-600 z-20">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
              </div>
              <input type="password" id="confirm-password" required minlength="6" class="block w-full pl-11 pr-12 py-3.5 text-md text-gray-900 font-bold bg-white rounded-xl border border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-indigo-600 peer" placeholder=" ">
              <label for="confirm-password" class="absolute text-sm rounded-xl text-gray-500 duration-300 transform -translate-y-[18px] scale-75 top-2 z-10 origin-[0] bg-white px-2 mx-2 start-10 peer-focus:text-indigo-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-65 peer-focus:-translate-y-[18px] cursor-text">Confirm Password</label>
              <button type="button" id="toggle-confirm-password-btn" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-indigo-600 focus:outline-none z-20">
                <svg id="eye-icon-2" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                <svg id="eye-slash-icon-2" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
              </button>
            </div>
            
            <div class="pt-4">
              <button type="submit" id="reset-action-btn" class="w-full relative flex items-center justify-center bg-[#0f172a] text-white text-md font-bold py-4 rounded-2xl hover:bg-slate-800 transition-all shadow-md">
                <span id="btn-text" class="transition-opacity">Update Password</span>
                <svg id="btn-spinner" class="w-5 h-5 animate-spin absolute opacity-0 transition-opacity" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
              </button>
            </div>
          </form>
          
          <div class="text-center mt-6 mb-4">
            <a href="index.html" class="text-sm font-semibold text-slate-400 hover:text-slate-600 transition-colors">&larr; Back to Login</a>
          </div>
        </div>
    </div>
  </div> 

  <!-- Global Toast Container -->
  <div id="toast-container" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 z-[120] flex flex-col items-center gap-2 w-max pointer-events-none max-w-[calc(100vw-2rem)]"></div>

  <!-- JavaScript combined via Module -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    // Initialize Supabase Client
    const supabaseUrl = 'https://qbdzwwqkcjnfcqlgnknc.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFiZHp3d3FrY2puZmNxbGdua25jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MzgyNTEsImV4cCI6MjEwMzAxNDI1MX0.GgeDNJCZwQdbfe9pKsDiV8Ld6rgJm_WkccI7iGbB4mg';
    const supabase = createClient(supabaseUrl, supabaseKey);

    // --- DOM Elements ---
    const resetForm = document.getElementById('reset-form');
    const newPasswordInput = document.getElementById('new-password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const resetActionBtn = document.getElementById('reset-action-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');

    // Password Visibility Toggles
    const toggleNewPasswordBtn = document.getElementById('toggle-new-password-btn');
    const eyeIcon1 = document.getElementById('eye-icon-1');
    const eyeSlashIcon1 = document.getElementById('eye-slash-icon-1');

    const toggleConfirmPasswordBtn = document.getElementById('toggle-confirm-password-btn');
    const eyeIcon2 = document.getElementById('eye-icon-2');
    const eyeSlashIcon2 = document.getElementById('eye-slash-icon-2');

    // --- Helper Functions ---
    const escapeHTML = (str) => { 
        const div = document.createElement('div'); 
        div.appendChild(document.createTextNode(str || '')); 
        return div.innerHTML; 
    };

    // Existing Toast Function copied exactly
    function showToast(message, type = 'error') {
        const toastContainer = document.getElementById('toast-container');
        if (!toastContainer) return;

        const toast = document.createElement('div');
        let icon = type === 'error' ? 
            `<svg class="w-5 h-5 text-red-400 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>` : 
            `<svg class="w-5 h-5 text-green-400 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

        toast.className = `bg-slate-800 text-white px-5 py-3 rounded-full shadow-2xl flex items-center text-sm font-bold tracking-wide transition-all duration-300 translate-y-10 opacity-0 pointer-events-auto border border-slate-700/50`;
        toast.innerHTML = `${icon}<span>${escapeHTML(message)}</span>`;

        toastContainer.appendChild(toast);

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
            });
        });

        setTimeout(() => {
            toast.classList.remove('translate-y-0', 'opacity-100');
            toast.classList.add('translate-y-10', 'opacity-0');
            toast.addEventListener('transitionend', () => toast.remove());
        }, 3000);
    }

    function setLoading(isLoading) {
        if (isLoading) {
            btnText.classList.add('opacity-0');
            btnSpinner.classList.remove('opacity-0');
            resetActionBtn.disabled = true;
        } else {
            btnText.classList.remove('opacity-0');
            btnSpinner.classList.add('opacity-0');
            resetActionBtn.disabled = false;
        }
    }

    // Set up UI validation styling for inputs
    function setInputStatus(inputEl, status) {
        inputEl.classList.remove('border-red-500', 'ring-1', 'ring-red-500', 'border-green-500', 'ring-green-500', 'focus:ring-indigo-600', 'border-gray-300');
        
        if (status === 'error') {
            inputEl.classList.add('border-red-500', 'ring-1', 'ring-red-500');
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        } else if (status === 'success') {
            inputEl.classList.add('border-green-500', 'ring-1', 'ring-green-500');
        } else {
            inputEl.classList.add('border-gray-300', 'focus:ring-indigo-600');
        }
    }

    // Clear error state on typing
    newPasswordInput?.addEventListener('input', () => setInputStatus(newPasswordInput, 'default'));
    confirmPasswordInput?.addEventListener('input', () => setInputStatus(confirmPasswordInput, 'default'));

    // --- Event Listeners for Password Visibility ---
    toggleNewPasswordBtn?.addEventListener('click', () => {
        const isPassword = newPasswordInput.getAttribute('type') === 'password';
        newPasswordInput.setAttribute('type', isPassword ? 'text': 'password');
        if (isPassword) {
            eyeIcon1.classList.add('hidden');
            eyeSlashIcon1.classList.remove('hidden');
        } else {
            eyeIcon1.classList.remove('hidden');
            eyeSlashIcon1.classList.add('hidden');
        }
    });

    toggleConfirmPasswordBtn?.addEventListener('click', () => {
        const isPassword = confirmPasswordInput.getAttribute('type') === 'password';
        confirmPasswordInput.setAttribute('type', isPassword ? 'text': 'password');
        if (isPassword) {
            eyeIcon2.classList.add('hidden');
            eyeSlashIcon2.classList.remove('hidden');
        } else {
            eyeIcon2.classList.remove('hidden');
            eyeSlashIcon2.classList.add('hidden');
        }
    });

    // --- Handle Password Recovery ---
    resetForm?.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!navigator.onLine) { 
            showToast("Please connect to the internet", "error"); 
            return; 
        }

        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (newPassword.length < 6) {
            showToast("Password must be at least 6 characters.", "error");
            setInputStatus(newPasswordInput, 'error');
            return;
        }

        if (newPassword !== confirmPassword) {
            showToast("Passwords do not match.", "error");
            setInputStatus(newPasswordInput, 'error');
            setInputStatus(confirmPasswordInput, 'error');
            return;
        }

        setLoading(true);

        // Update the password using the authenticated active session parsed from the recovery URL hash
        const { error } = await supabase.auth.updateUser({ 
            password: newPassword 
        });

        if (error) {
            setLoading(false);
            setInputStatus(newPasswordInput, 'error');
            setInputStatus(confirmPasswordInput, 'error');
            showToast(error.message || "Failed to update password. Link may have expired.", "error");
        } else {
            setLoading(false);
            setInputStatus(newPasswordInput, 'success');
            setInputStatus(confirmPasswordInput, 'success');
            showToast("Password reset successfully! Redirecting...", "success");
            
            // Redirect back to main application after a short delay
            setTimeout(() => {
                window.location.replace('index.html');
            }, 2000);
        }
    });
  </script>
</body>
</html>
